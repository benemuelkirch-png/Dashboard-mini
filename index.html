async function spotifyApi(path, method, body, isRetry) {
  if (!getTokens()) return null;
  const t = await refreshTokenIfNeeded(isRetry === true);
  if (t === 'offline') return null;
  if (!t) { setSpotifyBroken(true); return null; }
  const opts = { method, headers: { 'Authorization': 'Bearer ' + t.access_token } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch('https://api.spotify.com/v1' + path, opts); }
  catch (e) { markOffline(); return null; }
  markOnline();
  if (res.status === 401) {
    // Token abgelaufen: einmal automatisch erneuern, erst dann aufgeben
    if (!isRetry) return spotifyApi(path, method, body, true);
    setSpotifyBroken(true); return null;
  }
  setSpotifyBroken(false);
  if (res.status === 204 || res.status === 202) return null;
  if (!res.ok) {
    const msg = res.status === 404 ? 'Kein aktives Gerät – unter ☰ › Gerät eins wählen'
              : res.status === 429 ? 'Kurz warten…'
              : res.status === 403 ? 'Nur mit Spotify Premium möglich'
              : 'Spotify antwortet gerade nicht';
    showSpotifyNote(msg, false);
    return null;
  }
  try { return await res.json(); } catch (e) { return null; }
}

let lastTrackId = null;
let playerState = null;
async function pollNow() {
  if (!getTokens()) return;
  // /me/player liefert Song + Shuffle/Repeat + Gerät in einem Abruf
  const data = await spotifyApi('/me/player', 'GET');
  if (!spotifyBroken && !isOffline) {
    playerState = data || null;
    nowPlaying = (data && data.item) ? {
      name: data.item.name || '–',
      artist: (data.item.artists || []).map(a => a.name).join(', ') || (data.item.show ? data.item.show.name : ''),
      img: (data.item.album?.images?.[0]?.url) || (data.item.images?.[0]?.url) || '',
      progress: data.progress_ms || 0,
      duration: data.item.duration_ms || 0,
      playing: !!data.is_playing
    } : null;
    if (nowPlaying && nowPlaying.img) applyCoverColor(nowPlaying.img);
  }
  updateStandby();
  if (spotifyView !== 'player') return;
  const noteEl = document.getElementById('connNote');
  const trackEl = document.getElementById('track');
  const artistEl = document.getElementById('artist');
  const artEl = document.getElementById('art');
  const fillEl = document.getElementById('progressFill');
  const playBtn = document.getElementById('playBtn');
  const heartBtn = document.getElementById('heartBtn');
  if (!trackEl || !playBtn) return;
  if (spotifyBroken || isOffline) return;
  if (!data || !data.item) {
    trackEl.textContent = 'Nichts aktuell'; artistEl.textContent = '';
    playBtn.textContent = '▶'; playBtn.dataset.playing = '0';
    if (noteEl && !noteEl.textContent) noteEl.textContent = data ? 'Spotify pausiert' : 'Kein aktives Gerät – unter ☰ › Gerät wählen';
    return;
  }
  updateModeButtons(data);
  trackEl.textContent = nowPlaying.name;
  artistEl.textContent = nowPlaying.artist;
  const img = nowPlaying.img;
  if (img && artEl.getAttribute('src') !== img) artEl.src = img;
  const dur = data.item.duration_ms || 0, pos = data.progress_ms || 0;
  fillEl.style.width = dur ? Math.min(100, (pos / dur) * 100) + '%' : '0%';
  playBtn.textContent = data.is_playing ? '⏸' : '▶';
  playBtn.dataset.playing = data.is_playing ? '1' : '0';
  if (noteEl) noteEl.textContent = '';
  if (heartBtn && data.item.id && data.item.id !== lastTrackId) {
    lastTrackId = data.item.id;
    heartBtn.dataset.trackId = data.item.id;
    heartBtn.classList.remove('liked'); heartBtn.textContent = '♡';
    const uri = 'spotify:track:' + data.item.id;
    const contains = await spotifyApi('/me/library/contains?uris=' + encodeURIComponent(uri), 'GET');
    const isLiked = Array.isArray(contains) ? contains[0] : (contains ? contains[uri] : false);
    if (isLiked) { heartBtn.classList.add('liked'); heartBtn.textContent = '♥'; }
  }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(pollNow, 5000);
}
async function initSpotify() {
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  const state = url.searchParams.get('state');
  if (code && state && state === sessionStorage.getItem('sp_state')) {
    renderPlayer(); document.getElementById('track').textContent = 'Verbinde…';
    try {
      await exchangeCode(code);
      history.replaceState({}, '', location.pathname);
      spotifyBroken = false; updateNetPill();
      pollNow(); startPolling();
    } catch (e) { renderLoginButton(); }
    return;
  }
  if (!getConfig()) { renderSettingsForm(); return; }
  if (!getTokens()) { renderLoginButton(); return; }
  renderPlayer(); startPolling();
}
initSpotify();

/* ---- Zielbildschirm für Links (Window-Management-API, nur Edge/Chrome) ---- */
async function renderScreenPicker() {
  settingsTitle.textContent = 'Links öffnen auf';
  settingsBody.innerHTML = '';
  const note = document.createElement('p'); note.className = 'set-note';
  const wrap = document.createElement('div'); wrap.className = 'set-list';
  settingsBody.append(note, wrap);
  const back = () => renderSettingsMain();

  if (!('getScreenDetails' in window)) {
    note.textContent = 'Dein Browser unterstützt das nicht. Es funktioniert in Edge und Chrome, wenn die Seite über https läuft.';
    wrap.append(settingsButton('←', 'Zurück', '', back));
    return;
  }
  note.textContent = 'Beim ersten Mal fragt der Browser, ob die Seite Fenster auf allen Bildschirmen platzieren darf – bitte erlauben.';
  let details;
  try { details = await window.getScreenDetails(); }
  catch (e) {
    note.textContent = 'Der Browser hat die Berechtigung verweigert. Du kannst sie über das Schloss-Symbol in der Adresszeile („Fensterverwaltung“) wieder erlauben.';
    wrap.append(settingsButton('←', 'Zurück', '', back));
    return;
  }
  note.textContent = 'Wähle den Bildschirm, auf dem Links aus den Kacheln als eigenes Fenster aufgehen sollen. Nummeriert von links nach rechts.';
  const current = getLinkScreen();
  const screens = [...details.screens].sort((a, b) => a.availLeft - b.availLeft);
  screens.forEach((s, i) => {
    const isHere = s === details.currentScreen;
    const label = `Bildschirm ${i + 1}`;
    const hint = `${s.width}×${s.height}` + (s.isPrimary ? ' · Haupt' : '') + (isHere ? ' · Dashboard' : '');
    const active = current && current.left === s.availLeft && current.top === s.availTop;
    wrap.append(settingsButton('🖥', label, hint, () => {
      localStorage.setItem(SCREEN_KEY, JSON.stringify({
        left: s.availLeft, top: s.availTop, width: s.availWidth, height: s.availHeight, label
      }));
      renderScreenPicker();
    }, active));
  });
  wrap.append(
    settingsButton('↩', 'Im selben Fenster (neuer Tab)', '', () => { localStorage.removeItem(SCREEN_KEY); renderScreenPicker(); }, !current),
    settingsSep(),
    settingsButton('🧪', 'Testfenster öffnen', '', () => openLink('about:blank')),
    settingsButton('←', 'Zurück', '', back)
  );
}

const FONT_OPTIONS = [
  ['', 'Theme-Standard'],
  ["'Outfit', sans-serif", 'Outfit'],
  ["'Inter', sans-serif", 'Inter'],
  ["'Space Grotesk', sans-serif", 'Space Grotesk'],

function apRow(label, control) {
  const row = document.createElement('div'); row.className = 'ap-row';
  const l = document.createElement('span'); l.textContent = label;
  const c = document.createElement('div'); c.className = 'ap-ctrl';
  [].concat(control).forEach(el => c.appendChild(el));
  row.append(l, c);
  return row;
}
function apGroup(text) { const d = document.createElement('div'); d.className = 'ap-group'; d.textContent = text; return d; }

function apSelect(key, options) {
  const sel = document.createElement('select');
  options.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
  sel.value = appearance[key] || '';
  sel.addEventListener('change', () => {
    if (sel.value) appearance[key] = sel.value; else delete appearance[key];
    saveAppearance();
  });
  return sel;
}
function apRange(key, min, max, step, fallback, unit, onChange) {
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step;
  const v = document.createElement('span'); v.className = 'ap-val';
  const cur = (appearance[key] !== undefined && appearance[key] !== null) ? appearance[key] : fallback;
  r.value = cur; v.textContent = cur + unit;
  r.addEventListener('input', () => {
    appearance[key] = Number(r.value); v.textContent = r.value + unit;
    saveAppearance();
    if (onChange) onChange();
  });
  return [r, v];
}
function apSwitch(key, defaultOn, onChange) {
  const s = document.createElement('input'); s.type = 'checkbox'; s.className = 'sw';
  s.checked = appearance[key] === undefined ? defaultOn : appearance[key];
  s.addEventListener('change', () => {
    if (s.checked === defaultOn) delete appearance[key]; else appearance[key] = s.checked;
    saveAppearance();
    if (onChange) onChange();
  });
  return s;
}

function apHour(key, fallback) {
  const sel = document.createElement('select');
  for (let h = 0; h < 24; h++) {
    const o = document.createElement('option'); o.value = h; o.textContent = String(h).padStart(2, '0') + ':00'; sel.appendChild(o);
  }
  sel.value = appearance[key] !== undefined ? appearance[key] : fallback;
  sel.style.maxWidth = '78px';
  sel.addEventListener('change', () => { appearance[key] = Number(sel.value); saveAppearance(); scheduleStandby(); });
  return sel;
}

function renderAppearancePanel() {
  settingsTitle.textContent = 'Aussehen';
  settingsModal.classList.add('see-through');
  settingsBody.innerHTML = '';
  const themeRadius = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--radius')) || 20;

  // Akzentfarbe: Farbwähler + Zurücksetzen auf Theme-Farbe
  const color = document.createElement('input'); color.type = 'color'; color.className = 'ap-color';
  const curAccent = appearance.accent || getComputedStyle(document.documentElement).getPropertyValue('--violet').trim();
  color.value = /^#[0-9a-f]{6}$/i.test(curAccent) ? curAccent : '#8b7bff';
  color.addEventListener('input', () => { appearance.accent = color.value; saveAppearance(); });
  const colorReset = document.createElement('button'); colorReset.className = 'ap-mini'; colorReset.textContent = 'Theme';
  colorReset.addEventListener('click', () => { delete appearance.accent; saveAppearance(); renderAppearancePanel(); });

  settingsBody.append(
    apGroup('Schrift'),
    apRow('Schrift Text', apSelect('fontText', FONT_OPTIONS)),
    apRow('Schrift Zahlen', apSelect('fontNum', FONT_OPTIONS)),
    apRow('Schriftgröße', apRange('fs', 70, 140, 5, 100, '%')),
    apRow('Uhrgröße', apRange('fsClock', 60, 140, 5, 100, '%')),

    apGroup('Layout'),
    apRow('Abstand', apRange('gap', 4, 28, 1, 12, 'px')),
    apRow('Ecken-Rundung', apRange('radius', 0, 30, 1, themeRadius, 'px')),

    apGroup('Farbe'),
    apRow('Akzentfarbe', [color, colorReset]),
    apRow('Farbe vom Albumcover', apSwitch('coverColor', true)),

    apGroup('Anzeige'),
    apRow('Sekunden anzeigen', apSwitch('showSeconds', false, () => { lastClock = ''; clockEl.innerHTML = ''; tick(); scheduleTick(); })),
    apRow('Kalenderwoche', apSwitch('showKw', true)),
    apRow('Spotify & Schnellzugriff oben', apSwitch('actionsTop', true)),
    apRow('Animationen', apSwitch('animations', true)),
    apRow('Mauszeiger ausblenden', apSwitch('hideCursor', true, wakeCursor)),
    apRow('… nach Sekunden', apRange('cursorDelay', 1, 15, 1, 3, 's', wakeCursor)),

    apGroup('StandBy'),
    apRow('StandBy-Modus', apSwitch('standby', true, scheduleStandby)),
    apRow('Start nach', apRange('standbyIdle', 1, 30, 1, 5, ' min', scheduleStandby)),
    apRow('Nachts schon nach 30 s', apSwitch('standbyNight', false, scheduleStandby)),
    apRow('Nachts = von / bis', [apHour('standbyFrom', 20), apHour('standbyTo', 7)])
  );

  const actions = document.createElement('div'); actions.className = 'set-list'; actions.style.marginTop = '14px';
  actions.append(
    settingsButton('↺', 'Alles auf Standard zurücksetzen', '', () => {
      appearance = {}; saveAppearance();
      lastClock = ''; clockEl.innerHTML = ''; tick(); scheduleTick(); wakeCursor();
      renderAppearancePanel();
    }),
    settingsButton('←', 'Zurück', '', renderSettingsMain)
  );
  settingsBody.appendChild(actions);
}

/* ---- Backup: alles außer Spotify-Login ---- */
const BACKUP_KEYS = [STORAGE_KEY, SD_KEY, THEME_KEY, WEATHER_LOC_KEY, CFG_KEY, SCREEN_KEY, APPEARANCE_KEY, TODO_PREFS_KEY, VIEW_KEY];
function exportBackup() {
  const data = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
  const blob = new Blob([JSON.stringify({ app: 'mini-dashboard', version: 2, data }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dashboard-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); URL.revokeObjectURL(url);
}
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const loaded = JSON.parse(reader.result);
      if (Array.isArray(loaded)) {           // altes Format: nur To-Dos
        todos = loaded; render(); save(); closeSettings(); return;
      }
      if (loaded && loaded.data) {
        BACKUP_KEYS.forEach(k => { if (typeof loaded.data[k] === 'string') localStorage.setItem(k, loaded.data[k]); });
        location.reload();
      }
    } catch (err) { statusEl.textContent = 'Ungültige Datei'; }
  };
  reader.readAsText(file); e.target.value = '';
});
