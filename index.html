<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a:#161033; --bg-b:#0c2b40;
    --blob1: rgba(139,123,255,0.35); --blob2: rgba(29,185,84,0.18); --blob3: rgba(245,185,92,0.16);
    --glass: rgba(255,255,255,0.06); --glass-strong: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.14);
    --text:#f2f3f9; --sub:#a6acc4;
    --violet:#8b7bff; --violet-soft: rgba(139,123,255,0.25);
    --green:#1db954; --green-soft: rgba(29,185,84,0.22);
    --weather-accent:#f5b95c; --weather-soft: rgba(245,185,92,0.22);
    --number-font: 'Outfit', sans-serif;
    --radius: 20px;
  }
  body[data-theme="starwars"] {
    --bg-a:#08090b; --bg-b:#120e08;
    --blob1: rgba(232,179,76,0.22); --blob2: rgba(90,140,200,0.10); --blob3: rgba(232,179,76,0.08);
    --glass: rgba(255,255,255,0.035); --glass-strong: rgba(255,255,255,0.07);
    --border: rgba(232,179,76,0.22);
    --text:#f3ede0; --sub:#9a9488;
    --violet:#e8b34c; --violet-soft: rgba(232,179,76,0.2);
    --number-font: 'Orbitron', sans-serif;
    --radius: 10px;
  }
  body[data-theme="starwars"]::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 30% 85%, #fff, transparent),
      radial-gradient(1px 1px at 92% 60%, #fff, transparent),
      radial-gradient(1px 1px at 45% 40%, #fff, transparent);
    background-size: 100% 100%;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 14px; display: flex; flex-direction: row; gap: 12px; overflow: hidden;
    background:
      radial-gradient(circle at 12% 18%, var(--blob1), transparent 45%),
      radial-gradient(circle at 88% 82%, var(--blob2), transparent 50%),
      radial-gradient(circle at 85% 10%, var(--blob3), transparent 40%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b));
    background-attachment: fixed;
    transition: background 0.4s ease;
  }
  button, input { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font-family: inherit; user-select: none; }
  .card {
    background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); position: relative; overflow: hidden;
    container-type: size; container-name: card;
    transition: border-radius 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  h2 { font-size: clamp(0.8rem, min(3.4cqi, 5.5cqb), 1.05rem); font-weight: 600; color: var(--sub); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

  /* Spalten */
  .col-left { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-width: 0; min-height: 0; }
  .col-right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .col-left .card { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 8px; min-width: 0; min-height: 0; }

  /* Oben links: Uhrzeit/Datum/KW */
  .time-card { gap: min(2cqi, 3cqb); }
  .time-card::after {
    content: '🕐'; position: absolute; right: -20px; bottom: -30px; font-size: 7rem; opacity: 0.06;
  }
  .clock { font-family: var(--number-font); font-weight: 800; font-size: clamp(1.6rem, min(19cqi, 26cqb), 7rem); line-height: 1;
    background: linear-gradient(120deg, #fff, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .date-line { color: var(--text); font-size: clamp(0.8rem, min(7cqi, 9cqb), 1.5rem); font-weight: 600; }
  .kw-badge { color: var(--sub); font-size: clamp(0.65rem, min(4.5cqi, 6cqb), 1rem); font-weight: 600; padding: 0.8cqi 3cqi; background: var(--violet-soft); border-radius: 20px; }
  .fun-fact { color: var(--sub); font-size: clamp(0.6rem, min(3.6cqi, 5cqb), 0.85rem); margin-top: 4px; max-width: 95%; line-height: 1.3; }

  /* Wetter */
  .weather-card::after {
    content: '☁️'; position: absolute; left: -25px; top: -25px; font-size: 6rem; opacity: 0.06;
  }
  .weather-temp { font-family: var(--number-font); font-size: clamp(1.6rem, min(20cqi, 28cqb), 3.4rem); font-weight: 700; }
  .weather-desc { color: var(--sub); font-size: clamp(0.7rem, min(6cqi, 8.5cqb), 1rem); }
  .weather-minmax { color: var(--sub); font-size: clamp(0.65rem, min(5cqi, 7.5cqb), 0.95rem); padding: 0.6cqi 2.5cqi; background: var(--weather-soft); border-radius: 20px; margin-top: 2px; }
  .weather-icon { font-size: clamp(1.8rem, min(24cqi, 30cqb), 3.8rem); filter: drop-shadow(0 4px 10px rgba(245,185,92,0.35)); }

  /* Spotify */
  .spotify-card::after {
    content: '♫'; position: absolute; right: -15px; bottom: -35px; font-size: 8rem; opacity: 0.07; color: var(--green);
  }
  .art { width: clamp(64px, min(34cqi, 42cqb), 130px); height: clamp(64px, min(34cqi, 42cqb), 130px); border-radius: calc(var(--radius) * 0.7); background: var(--glass-strong); object-fit: cover; flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--green-soft), 0 8px 22px rgba(29,185,84,0.3); }
  .track { font-weight: 700; font-size: clamp(0.8rem, min(7cqi, 10cqb), 1.15rem); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--sub); font-size: clamp(0.7rem, min(6cqi, 8.5cqb), 1rem); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--green); }
  .controls { display: flex; align-items: center; gap: min(2.5cqi, 4cqb); }
  .ctrl-btn { background: var(--glass-strong); border: 1px solid var(--border); color: var(--text); border-radius: 50%;
    width: clamp(34px, min(13cqi, 18cqb), 46px); height: clamp(34px, min(13cqi, 18cqb), 46px); font-size: clamp(0.85rem, min(6cqi, 8.5cqb), 1.05rem); cursor: pointer; }
  .ctrl-btn.main { width: clamp(40px, min(16cqi, 22cqb), 54px); height: clamp(40px, min(16cqi, 22cqb), 54px); background: var(--green); border: none; font-size: clamp(0.9rem, min(7cqi, 9.5cqb), 1.15rem); color: #08240f; }
  .ctrl-btn.heart { color: var(--sub); background: none; border: none; width: clamp(34px, min(13cqi,18cqb), 44px); height: clamp(34px, min(13cqi,18cqb), 44px); font-size: clamp(0.95rem, min(8cqi, 10.5cqb), 1.25rem); display: flex; align-items: center; justify-content: center; }
  .ctrl-btn.heart.liked { color: #ff5c8a; }
  .conn-note { font-size: clamp(0.55rem, min(3.5cqi, 6cqb), 0.72rem); color: var(--sub); }
  .link-btn { background: var(--violet); color: #fff; border: none; border-radius: 30px; padding: 9px 18px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
  .settings { display: flex; flex-direction: column; gap: 8px; width: 95%; }
  .settings label { font-size: 0.7rem; color: var(--sub); text-align: left; }
  input[type=text] { background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 11px 13px; font-size: 0.9rem; }
  .flip-btn { background: var(--glass-strong); border: 1px solid var(--border); color: var(--text); border-radius: 50%;
    width: clamp(26px, min(10cqi, 14cqb), 32px); height: clamp(26px, min(10cqi, 14cqb), 32px); font-size: clamp(0.7rem, min(5cqi, 7cqb), 0.85rem);
    cursor: pointer; position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 0; }
  .pl-view { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; }
  .pl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-right: 36px; }
  .pl-header h3 { margin: 0; font-size: clamp(0.8rem, 3cqi, 1rem); color: var(--text); }
  .pl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; width: 100%; text-align: left; }
  .pl-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--glass-strong); border: 1px solid var(--border);
    border-radius: calc(var(--radius) * 0.6); cursor: pointer; }
  .pl-row:hover { background: rgba(255,255,255,0.16); }
  .pl-art { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; background: var(--bg-a); flex-shrink: 0; }
  .pl-name { font-size: clamp(0.78rem, 2.4cqi, 0.95rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ToDo rechts, volle Höhe */
  .todo-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  form input[type=text] { flex: 1; font-size: clamp(0.9rem, 2.3cqi, 1.1rem); padding: 10px 14px; }
  form .link-btn { font-size: clamp(0.95rem, 2.4cqi, 1.15rem); padding: 10px 20px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1;
    scrollbar-width: thin; scrollbar-color: rgba(139,123,255,0.5) transparent; }
  ul::-webkit-scrollbar { width: 6px; }
  ul::-webkit-scrollbar-track { background: transparent; }
  ul::-webkit-scrollbar-thumb { background: rgba(139,123,255,0.45); border-radius: 10px; }
  ul::-webkit-scrollbar-thumb:hover { background: rgba(139,123,255,0.7); }
  li { display: flex; align-items: center; gap: 10px; padding: clamp(8px, 1.6cqi, 16px) clamp(10px, 2cqi, 18px); background: var(--glass-strong); border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.7); }
  li.done { opacity: 0.6; }
  li.done .label { text-decoration: line-through; color: var(--sub); }
  .label { flex: 1; word-break: break-word; font-size: clamp(0.95rem, 2.3cqi, 1.2rem); }
  .check { width: clamp(26px, 2.8cqi, 30px); height: clamp(26px, 2.8cqi, 30px); border-radius: 50%; border: 2px solid var(--violet); cursor: pointer; flex-shrink: 0; background: none; color: #fff; font-size: clamp(0.7rem, 1.6cqi, 0.9rem); display: flex; align-items: center; justify-content: center; }
  li.done .check { background: var(--violet); }
  li.done .check::after { content: '✓'; }
  .del { background: none; color: var(--sub); border: none; padding: 8px 10px; font-size: clamp(1rem, 2.4cqi, 1.3rem); cursor: pointer; }
  .status { font-size: clamp(0.6rem, 2cqi, 0.8rem); color: var(--sub); text-align: right; min-height: 1em; }
  /* Streamdeck / Schnellzugriff */
  .streamdeck-card { align-items: stretch !important; text-align: left !important; justify-content: stretch !important; position: relative; padding-top: 32px; }
  .streamdeck-card::after {
    content: '🚀'; position: absolute; left: -20px; top: -25px; font-size: 6.5rem; opacity: 0.06;
  }
  .sd-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: min(2.2cqi, 3.2cqb); flex: 1; min-height: 0; min-width: 0; }
  .sd-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--glass-strong); border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.6);
    cursor: pointer; color: var(--text); padding: 4px; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none;
    min-width: 0; min-height: 0; }
  .sd-btn .sd-icon { font-size: clamp(0.6rem, min(11cqi, 15cqb), 1.8rem); min-width: 0; }
  .sd-btn .sd-label { font-size: clamp(0.35rem, min(4cqi, 5.5cqb), 0.75rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; min-width: 0; }
  .sd-remove { position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255,90,90,0.9); color: #fff; font-size: 0.6rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; }
  .sd-edit { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255,255,255,0.85); color: #222; font-size: 0.55rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; }
  .sd-move { position: absolute; bottom: 2px; width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255,255,255,0.7); color: #222; font-size: 0.6rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; padding: 0; }
  .sd-move-left { left: 2px; }
  .sd-move-right { right: 2px; }
  .sd-move[disabled] { opacity: 0.3; cursor: not-allowed; }
  .streamdeck-card.edit-mode .sd-remove,
  .streamdeck-card.edit-mode .sd-edit,
  .streamdeck-card.edit-mode .sd-move { display: flex; }
  .streamdeck-card.edit-mode .sd-btn { opacity: 0.85; }

  /* Ecken-Buttons: in die jeweilige Kachel eingebettet, nicht am Viewport */
  .corner-toolbar { position: absolute; top: 10px; z-index: 5; display: flex; gap: 6px; }
  .corner-toolbar.left { left: 10px; }
  .corner-toolbar.right { right: 10px; }
  .corner-btn { width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--sub); font-size: 0.78rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.65;
    transition: opacity 0.2s ease, background 0.2s ease; padding: 0; }
  .corner-btn:hover { opacity: 1; background: rgba(255,255,255,0.14); }

  /* Modal zum Bearbeiten einer Streamdeck-Kachel */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
    align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg-b); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; width: min(320px, 85vw); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .modal-box h3 { margin: 0 0 14px; font-size: 1rem; color: var(--text); }
  .modal-box label { display: block; font-size: 0.75rem; color: var(--sub); margin: 10px 0 4px; }
  .modal-box input[type=text] { width: 100%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 12px; border: none; cursor: pointer; font-size: 0.9rem; }
  .modal-save { background: var(--violet); color: #fff; font-weight: 600; }
  .modal-cancel { background: rgba(255,255,255,0.1); color: var(--text); }
</style>
</head>
<body>
  <div class="col-left">
    <div class="card time-card">
      <div class="corner-toolbar left">
        <button class="corner-btn" id="fsBtn" title="Vollbild umschalten">⛶</button>
        <button class="corner-btn" id="themeBtn" title="Theme wechseln">🌌</button>
      </div>
      <div class="clock" id="clock">--:--</div>
      <div class="date-line" id="date"></div>
      <div class="kw-badge" id="kw"></div>
      <div class="fun-fact" id="funFact"></div>
    </div>
    <div class="card weather-card" id="weatherCard"><div class="weather-desc">Wetter lädt…</div></div>
    <div class="card spotify-card" id="spotifyCard"></div>
    <div class="card streamdeck-card" id="streamdeckCard">
      <div class="corner-toolbar right">
        <button class="corner-btn" id="sdAddBtn" title="Hinzufügen">+</button>
        <button class="corner-btn" id="sdEditToggle" title="Bearbeiten">✎</button>
      </div>
      <div class="sd-grid" id="sdGrid"></div>
    </div>
  </div>

  <div class="col-right">
    <div class="card todo-card">
      <form id="form">
        <input type="text" id="newTodo" placeholder="Neue Aufgabe…" autocomplete="off">
        <button type="submit" class="link-btn">+</button>
      </form>
      <ul id="list"></ul>
      <div class="status" id="status"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" id="exportBtn" style="background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text); border-radius:12px; flex:1; padding:9px; cursor:pointer;">Backup speichern</button>
        <button type="button" id="importBtn" style="background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text); border-radius:12px; flex:1; padding:9px; cursor:pointer;">Backup laden</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="tileModal">
    <div class="modal-box">
      <h3 id="tileModalTitle">Kachel bearbeiten</h3>
      <label>Name</label>
      <input type="text" id="tileModalLabel" placeholder="z. B. Mail">
      <label>Link</label>
      <input type="text" id="tileModalUrl" placeholder="https://… oder file:///C:/Ordner/Datei.html">
      <label>Icon/Emoji</label>
      <input type="text" id="tileModalIcon" placeholder="🔗">
      <div class="modal-actions">
        <button class="modal-cancel" id="tileModalCancel">Abbrechen</button>
        <button class="modal-save" id="tileModalSave">Speichern</button>
      </div>
    </div>
  </div>

<script>
/* ---------------- Streamdeck / Schnellzugriff ---------------- */
const SD_KEY = 'dashboard_streamdeck_v1';
let sdLinks = [];
try { sdLinks = JSON.parse(localStorage.getItem(SD_KEY)) || []; } catch (e) { sdLinks = []; }
const sdGrid = document.getElementById('sdGrid');
const sdCard = document.getElementById('streamdeckCard');

function saveStreamdeck() {
  localStorage.setItem(SD_KEY, JSON.stringify(sdLinks));
}
function renderStreamdeck() {
  sdGrid.innerHTML = '';
  sdLinks.forEach((link, idx) => {
    const btn = document.createElement('div');
    btn.className = 'sd-btn';
    btn.innerHTML = `<button class="sd-remove" title="Entfernen">✕</button>` +
      `<button class="sd-edit" title="Bearbeiten">✎</button>` +
      `<button class="sd-move sd-move-left" title="Nach vorne">◀</button>` +
      `<button class="sd-move sd-move-right" title="Nach hinten">▶</button>` +
      `<div class="sd-icon">${link.icon || '🔗'}</div><div class="sd-label">${link.label}</div>`;
    btn.addEventListener('click', (e) => {
      if (e.target.closest('.sd-remove') || e.target.closest('.sd-edit') || e.target.closest('.sd-move')) return;
      if (sdCard.classList.contains('edit-mode')) return;
      window.open(link.url, '_blank');
    });
    btn.querySelector('.sd-remove').addEventListener('click', () => {
      sdLinks.splice(idx, 1);
      saveStreamdeck();
      renderStreamdeck();
    });
    btn.querySelector('.sd-edit').addEventListener('click', () => {
      editStreamdeckLink(idx);
    });
    const leftBtn = btn.querySelector('.sd-move-left');
    const rightBtn = btn.querySelector('.sd-move-right');
    leftBtn.disabled = idx === 0;
    rightBtn.disabled = idx === sdLinks.length - 1;
    leftBtn.addEventListener('click', () => moveStreamdeckLink(idx, -1));
    rightBtn.addEventListener('click', () => moveStreamdeckLink(idx, 1));
    sdGrid.appendChild(btn);
  });
}
function moveStreamdeckLink(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sdLinks.length) return;
  const [item] = sdLinks.splice(idx, 1);
  sdLinks.splice(newIdx, 0, item);
  saveStreamdeck();
  renderStreamdeck();
}
/* ---- Modal zum Hinzufügen/Bearbeiten einer Kachel ---- */
const tileModal = document.getElementById('tileModal');
const tileModalTitle = document.getElementById('tileModalTitle');
const tileModalLabel = document.getElementById('tileModalLabel');
const tileModalUrl = document.getElementById('tileModalUrl');
const tileModalIcon = document.getElementById('tileModalIcon');
let tileModalEditIdx = null; // null = neue Kachel, Zahl = bestehende Kachel bearbeiten

function openTileModal(idx) {
  tileModalEditIdx = (typeof idx === 'number') ? idx : null;
  if (tileModalEditIdx !== null) {
    const link = sdLinks[tileModalEditIdx] || {};
    tileModalTitle.textContent = 'Kachel bearbeiten';
    tileModalLabel.value = link.label || '';
    tileModalUrl.value = link.url || '';
    tileModalIcon.value = link.icon || '🔗';
  } else {
    tileModalTitle.textContent = 'Neue Kachel';
    tileModalLabel.value = '';
    tileModalUrl.value = '';
    tileModalIcon.value = '🔗';
  }
  tileModal.classList.add('open');
  setTimeout(() => tileModalLabel.focus(), 50);
}
function closeTileModal() {
  tileModal.classList.remove('open');
  tileModalEditIdx = null;
}
document.getElementById('tileModalCancel').addEventListener('click', closeTileModal);
tileModal.addEventListener('click', (e) => { if (e.target === tileModal) closeTileModal(); });
document.getElementById('tileModalSave').addEventListener('click', () => {
  const label = tileModalLabel.value.trim();
  const url = tileModalUrl.value.trim();
  const icon = tileModalIcon.value.trim() || '🔗';
  if (!label || !url) { tileModalLabel.focus(); return; }
  const entry = { label, url, icon };
  if (tileModalEditIdx !== null) {

  saveStreamdeck();

  closeTileModal();
});

/* ---------------- Uhrzeit / Datum / Kalenderwoche ---------------- */
function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('date').textContent = now.toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('kw').textContent = 'KW ' + isoWeek(now);
}

/* ---------------- Fun Fact des Tages (numbersapi.com) ---------------- */
const FACT_KEY = 'dashboard_funfact_v1';
async function loadFunFact() {
  const factEl = document.getElementById('funFact');
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(FACT_KEY)); } catch (e) {}
  if (cached && cached.date === todayStr && cached.text) {
    factEl.textContent = '💡 ' + cached.text;
    return;
  }
  try {
    const month = now.getMonth() + 1, day = now.getDate();
    const res = await fetch(`https://numbersapi.com/${month}/${day}/date?json`);
    const data = await res.json();
    const text = data && data.text ? data.text : null;
    if (text) {
      localStorage.setItem(FACT_KEY, JSON.stringify({ date: todayStr, text }));
      factEl.textContent = '💡 ' + text;
    }
  } catch (e) {
    if (cached && cached.text) factEl.textContent = '💡 ' + cached.text;
  }
}
loadFunFact();

/* ---------------- Wetter (Open-Meteo, kein API-Key nötig) ---------------- */
const WEATHER_LOC_KEY = 'dashboard_weather_loc_v1';
const weatherCard = document.getElementById('weatherCard');
const WMO = {
  0:['Klar','☀️'],1:['Meist klar','🌤️'],2:['Teilw. bewölkt','⛅'],3:['Bewölkt','☁️'],
  45:['Nebel','🌫️'],48:['Nebel','🌫️'],51:['Nieselregen','🌦️'],53:['Nieselregen','🌦️'],55:['Nieselregen','🌦️'],
  61:['Regen','🌧️'],63:['Regen','🌧️'],65:['Starker Regen','🌧️'],71:['Schnee','❄️'],73:['Schnee','❄️'],75:['Starker Schnee','❄️'],
  80:['Schauer','🌦️'],81:['Schauer','🌦️'],82:['Starke Schauer','🌦️'],95:['Gewitter','⛈️'],96:['Gewitter','⛈️'],99:['Gewitter','⛈️']
};
function wmoInfo(code) { return WMO[code] || ['–','—']; }

function renderWeatherSettings() {
  weatherCard.innerHTML = `
    <div class="settings">
      <label>Ort (Stadt)</label>
      <input type="text" id="wCity" placeholder="z. B. Rottenburg am Neckar">
      <button class="link-btn" id="wSave">Speichern</button>
    </div>`;
  document.getElementById('wSave').onclick = async () => {
    const city = document.getElementById('wCity').value.trim();
    if (!city) return;
    weatherCard.innerHTML = '<div class="weather-desc">Suche Ort…</div>';
    try {
      const geo = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + encodeURIComponent(city)).then(r => r.json());
      const hit = geo.results?.[0];
      if (!hit) { weatherCard.innerHTML = '<div class="weather-desc">Ort nicht gefunden</div>'; return; }
      localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify({ lat: hit.latitude, lon: hit.longitude, name: hit.name }));

    } catch (e) { weatherCard.innerHTML = '<div class="weather-desc">Fehler bei Ortssuche</div>'; }

async function loadWeather() {
  let loc = null;
  try { loc = JSON.parse(localStorage.getItem(WEATHER_LOC_KEY)); } catch (e) {}
  if (!loc) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => { fetchWeather(pos.coords.latitude, pos.coords.longitude, ''); },
        () => renderWeatherSettings(),
        { timeout: 5000 }
      );
    } else renderWeatherSettings();
    return;
  }
  fetchWeather(loc.lat, loc.lon, loc.name);
}

async function fetchWeather(lat, lon, name) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const data = await fetch(url).then(r => r.json());
    const code = data.current.weather_code;
    const [desc, icon] = wmoInfo(code);
    const accent = code === 0 || code === 1 ? '#f5b95c' : (code >= 61 && code <= 82) ? '#5bb8ff' : (code >= 71 && code <= 75) ? '#8fd8ff' : '#a6acc4';
    weatherCard.style.setProperty('--weather-accent', accent);
    weatherCard.style.setProperty('--weather-soft', accent + '33');
    weatherCard.innerHTML = `
      <div class="weather-icon">${icon}</div>
      <div class="weather-temp">${Math.round(data.current.temperature_2m)}°C</div>
      <div class="weather-desc">${desc}${name ? ' · ' + name : ''}</div>
      <div class="weather-minmax">↓${Math.round(data.daily.temperature_2m_min[0])}° / ↑${Math.round(data.daily.temperature_2m_max[0])}°</div>
      <button class="link-btn" id="wChange" style="background:rgba(255,255,255,0.12); font-size:0.65rem; padding:6px 12px; margin-top:2px;">Ort ändern</button>`;
    document.getElementById('wChange').onclick = renderWeatherSettings;
  } catch (e) {
    weatherCard.innerHTML = '<div class="weather-desc">Wetter nicht verfügbar</div>';
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

/* ---------------- Spotify: echte Steuerung via PKCE OAuth (kompakt) ---------------- */
const CFG_KEY = 'spotify_pkce_config_v1';
const TOKEN_KEY = 'spotify_pkce_tokens_v1';
const SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state user-library-modify user-library-read playlist-read-private playlist-read-collaborative';
const card = document.getElementById('spotifyCard');
let spotifyView = 'player'; // 'player' oder 'playlists' - steuert, ob pollNow() den DOM anfassen darf

function getConfig() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } }
function setConfig(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function getTokens() { try { return JSON.parse(localStorage.getItem(TOKEN_KEY)) || null; } catch (e) { return null; } }
function setTokens(t) { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }

function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = ''; const arr = crypto.getRandomValues(new Uint8Array(len));
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
async function sha256base64url(str) {
  const data = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function renderSettingsForm() {
  card.innerHTML = `
    <div class="settings">
      <label>Spotify Client ID</label>
      <input type="text" id="cfgClientId" placeholder="z. B. 1a2b3c4d...">
      <label>Redirect URI</label>
      <input type="text" id="cfgRedirect" value="${location.origin + location.pathname}">
      <button class="link-btn" id="cfgSave">Speichern</button>
    </div>`;
  document.getElementById('cfgSave').onclick = () => {
    const clientId = document.getElementById('cfgClientId').value.trim();
    const redirect = document.getElementById('cfgRedirect').value.trim();
    if (!clientId || !redirect) return;
    setConfig({ clientId, redirect });
    renderLoginButton();
  };
}
function renderLoginButton() {
  card.innerHTML = `<div class="track">Nicht verbunden</div>
    <button class="link-btn" id="loginBtn">Mit Spotify verbinden</button>`;
  document.getElementById('loginBtn').onclick = startLogin;
}
async function startLogin() {
  const cfg = getConfig();
  const verifier = randomString(64);
  const challenge = await sha256base64url(verifier);
  const state = randomString(16);
  sessionStorage.setItem('sp_verifier', verifier);
  sessionStorage.setItem('sp_state', state);
  const params = new URLSearchParams({
    client_id: cfg.clientId, response_type: 'code', redirect_uri: cfg.redirect,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES, state, show_dialog: 'true'
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
async function exchangeCode(code) {
  const cfg = getConfig();
  const verifier = sessionStorage.getItem('sp_verifier');
  const body = new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: cfg.redirect, client_id: cfg.clientId, code_verifier: verifier });
  const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  if (!res.ok) throw new Error('token exchange failed');
  const data = await res.json();
  setTokens({ access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + data.expires_in * 1000, scope: data.scope });
  return data.scope;
}
async function refreshTokenIfNeeded() {
  const t = getTokens(); if (!t) return null;
  if (Date.now() < t.expires_at - 30000) return t;
  const cfg = getConfig();
  const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: cfg.clientId });
  const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  if (!res.ok) return null;
  const data = await res.json();
  const newTokens = { access_token: data.access_token, refresh_token: data.refresh_token || t.refresh_token, expires_at: Date.now() + data.expires_in * 1000 };
  setTokens(newTokens); return newTokens;
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function renderPlayer() {
  spotifyView = 'player';
  card.innerHTML = `
    <button class="flip-btn" id="plFlipBtn" title="Playlists">📂</button>
    <img class="art" id="art" alt="Cover">
    <div style="min-width:0; width:100%;">
      <div class="track" id="track">Lädt…</div>
      <div class="artist" id="artist"></div>
    </div>
    <div class="progress-bar" style="width:100%;"><div class="progress-fill" id="progressFill"></div></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn main" id="playBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
      <button class="ctrl-btn heart" id="heartBtn" title="Zu Favoriten hinzufügen">♡</button>
    </div>
    <div class="conn-note" id="connNote"></div>
    <button class="link-btn" id="reconnectBtn" style="background:none; color:var(--sub); font-size:0.65rem; padding:2px 6px; text-decoration:underline;">Neu verbinden</button>`;
  document.getElementById('reconnectBtn').onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    startLogin();
  };
  document.getElementById('plFlipBtn').onclick = renderPlaylistsView;
  document.getElementById('prevBtn').onclick = () => spotifyApi('/me/player/previous', 'POST');
  document.getElementById('nextBtn').onclick = () => spotifyApi('/me/player/next', 'POST');
  document.getElementById('playBtn').onclick = async () => {
    const playing = document.getElementById('playBtn').dataset.playing === '1';
    await spotifyApi(playing ? '/me/player/pause' : '/me/player/play', 'PUT');
    pollNow();
  };
  document.getElementById('heartBtn').onclick = async (e) => {
    const btn = e.currentTarget;
    const trackId = btn.dataset.trackId;
    if (!trackId) return;
    const uri = 'spotify:track:' + trackId;
    const liked = btn.classList.contains('liked');
    await spotifyApi('/me/library?uris=' + encodeURIComponent(uri), liked ? 'DELETE' : 'PUT');
    btn.classList.toggle('liked');
    btn.textContent = liked ? '♡' : '♥';
  };
  pollNow();
}

/* ---- Zweite Seite der Spotify-Kachel: eigene Playlists durchblättern & starten ---- */
async function renderPlaylistsView() {
  spotifyView = 'playlists';
  card.innerHTML = `
    <button class="flip-btn" id="plBackBtn" title="Zurück zum Player">▶</button>
    <div class="pl-view">
      <div class="pl-header"><h3>Deine Playlists</h3></div>
      <div class="conn-note" id="plNote">Lädt…</div>
      <ul class="pl-list" id="plList"></ul>
    </div>`;
  document.getElementById('plBackBtn').onclick = () => { renderPlayer(); };
  const data = await spotifyApi('/me/playlists?limit=50', 'GET');
  const noteEl = document.getElementById('plNote');
  const listEl = document.getElementById('plList');
  if (!data || !Array.isArray(data.items)) {
    if (noteEl) noteEl.textContent = 'Playlists konnten nicht geladen werden (Berechtigung fehlt evtl. – einmal "Neu verbinden").';
    return;
  }
  if (noteEl) noteEl.textContent = '';
  data.items.filter(Boolean).forEach(pl => {
    const li = document.createElement('li');
    li.className = 'pl-row';
    const img = pl.images && pl.images[0] ? pl.images[0].url : '';
    li.innerHTML = `${img ? `<img class="pl-art" src="${img}" alt="">` : '<div class="pl-art"></div>'}<div class="pl-name">${pl.name}</div>`;
    li.addEventListener('click', async () => {
      if (noteEl) noteEl.textContent = 'Starte „' + pl.name + '“…';
      await spotifyApi('/me/player/play', 'PUT', { context_uri: pl.uri });
      renderPlayer();
    });
    listEl.appendChild(li);
  });
  if (!data.items.length && noteEl) noteEl.textContent = 'Keine Playlists gefunden.';
}

async function spotifyApi(path, method, body) {
  const t = await refreshTokenIfNeeded(); if (!t) return null;
  const opts = { method, headers: { 'Authorization': 'Bearer ' + t.access_token } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch('https://api.spotify.com/v1' + path, opts);
  if (res.status === 204 || res.status === 202) return null;
  if (!res.ok) { const n = document.getElementById('connNote') || document.getElementById('plNote'); if (n) n.textContent = 'Fehler: ' + res.status; return null; }
  try { return await res.json(); } catch (e) { return null; }
}
let lastTrackId = null;
async function pollNow() {
  if (spotifyView !== 'player') return;
  const data = await spotifyApi('/me/player/currently-playing', 'GET');
  if (spotifyView !== 'player') return;
  const noteEl = document.getElementById('connNote');
  const trackEl = document.getElementById('track');
  const artistEl = document.getElementById('artist');
  const artEl = document.getElementById('art');
  const fillEl = document.getElementById('progressFill');
  const playBtn = document.getElementById('playBtn');
  const heartBtn = document.getElementById('heartBtn');
  if (!trackEl || !playBtn) return;
  if (!data || !data.item) {
    if (trackEl) trackEl.textContent = 'Nichts aktuell'; if (artistEl) artistEl.textContent = '';
    if (noteEl) noteEl.textContent = 'Spotify irgendwo öffnen';
    return;
  }
  trackEl.textContent = data.item.name || '–';
  artistEl.textContent = (data.item.artists || []).map(a => a.name).join(', ');
  const img = data.item.album?.images?.[0]?.url;
  if (img) artEl.src = img;
  const dur = data.item.duration_ms || 0, pos = data.progress_ms || 0;
  fillEl.style.width = dur ? Math.min(100, (pos / dur) * 100) + '%' : '0%';
  playBtn.textContent = data.is_playing ? '⏸' : '▶';
  playBtn.dataset.playing = data.is_playing ? '1' : '0';
  noteEl.textContent = '';
  if (heartBtn && data.item.id && data.item.id !== lastTrackId) {
    lastTrackId = data.item.id;
    heartBtn.dataset.trackId = data.item.id;
    heartBtn.classList.remove('liked'); heartBtn.textContent = '♡';
    const uri = 'spotify:track:' + data.item.id;
    const contains = await spotifyApi('/me/library/contains?uris=' + encodeURIComponent(uri), 'GET');
    const isLiked = Array.isArray(contains) ? contains[0] : (contains ? contains[uri] : false);
    if (isLiked) { heartBtn.classList.add('liked'); heartBtn.textContent = '♥'; }
  }
}
async function initSpotify() {
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  const state = url.searchParams.get('state');
  if (code && state && state === sessionStorage.getItem('sp_state')) {
    renderPlayer(); document.getElementById('track').textContent = 'Verbinde…';
    try {
      const grantedScope = await exchangeCode(code);
      history.replaceState({}, '', location.pathname);
      const hasLibrary = grantedScope && grantedScope.includes('user-library-modify');
      pollNow();
      setInterval(pollNow, 5000);
      if (!hasLibrary) {
        setTimeout(() => {
          const n = document.getElementById('connNote');
          if (n) n.textContent = '⚠️ Favoriten-Berechtigung fehlt weiterhin';
        }, 1500);
      }
    } catch (e) { renderLoginButton(); }
    return;
  }
  const cfg = getConfig();
  if (!cfg) { renderSettingsForm(); return; }
  const t = getTokens();
  if (!t) { renderLoginButton(); return; }
  renderPlayer(); pollNow(); setInterval(pollNow, 5000);
}
initSpotify();
