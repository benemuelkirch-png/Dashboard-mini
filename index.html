<script>
  /* Gespeichertes Theme sofort setzen - noch bevor irgendetwas gezeichnet wird,
     damit auch der Startbildschirm schon im richtigen Look erscheint */
  try { var t = localStorage.getItem('dashboard_theme_v1'); if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

  /* Aussehen-Einstellungen ebenfalls sofort anwenden. Leere Werte = Theme-Standard. */
  window.applyAppearance = function (a) {
    a = a || {};
    var r = document.documentElement, s = r.style;
    function set(k, v) { if (v === undefined || v === null || v === '') s.removeProperty(k); else s.setProperty(k, String(v)); }
    set('--fs', a.fs ? a.fs / 100 : '');
    set('--fs-clock', a.fsClock ? a.fsClock / 100 : '');
    set('--gap', (a.gap !== undefined && a.gap !== null) ? a.gap + 'px' : '');
    set('--radius', (a.radius !== undefined && a.radius !== null) ? a.radius + 'px' : '');
    set('--violet', a.accent || '');
    set('--violet-soft', a.accent ? 'color-mix(in srgb, ' + a.accent + ' 25%, transparent)' : '');
    set('--font-text', a.fontText || '');
    set('--number-font', a.fontNum || '');
    r.classList.toggle('no-cover', a.coverColor === false);
    // Display steht unter den Monitoren: Maus kommt von oben -> oft geklickte Kacheln nach oben
    r.classList.toggle('actions-top', a.actionsTop !== false);
    r.classList.toggle('hide-kw', a.showKw === false);
    r.classList.toggle('no-anim', a.animations === false);
    r.classList.toggle('clock-sec', a.showSeconds === true);
  };
  try { applyAppearance(JSON.parse(localStorage.getItem('dashboard_appearance_v1')) || {}); } catch (e) {}
</script>
<style>
  /* Akzentfarbe vom Albumcover - als registrierte Property, damit sie weich überblendet */
  @property --cover { syntax: '<color>'; inherits: true; initial-value: rgb(29,185,84); }

  :root {
    --bg-a:#161033; --bg-b:#0c2b40;
    --blob1: rgba(139,123,255,0.35); --blob2: rgba(29,185,84,0.18); --blob3: rgba(245,185,92,0.16);
    --glass: rgba(255,255,255,0.06); --glass-strong: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.14);
    --text:#f2f3f9; --sub:#a6acc4;
    --violet:#8b7bff; --violet-soft: rgba(139,123,255,0.25);
    --green:#1db954; --green-soft: rgba(29,185,84,0.22);
    --weather-accent:#f5b95c; --weather-soft: rgba(245,185,92,0.22);
    --number-font: 'Outfit', sans-serif;
    --radius: 20px;
  }
  /* ---------- Theme: Minimal ---------- */
  html[data-theme="mono"] {
    --bg-a:#000; --bg-b:#000;
    --blob1: transparent; --blob2: transparent; --blob3: transparent;
    --glass: #0a0a0a; --glass-strong: #141414;
    --border: #262626;
    --text:#f5f5f5; --sub:#8a8a8a;
    --violet:#ffffff; --violet-soft: rgba(255,255,255,0.08);
    --weather-soft: transparent;
    --number-font: 'Outfit', sans-serif;
    --radius: 6px;
  }
  /* Minimal = ruhige schwarze Flächen, aber Farbe überall dort, wo sie etwas bedeutet
     (Status, Auftragsart, Priorität, Albumcover). Farben leicht gedämpft. */
  html[data-theme="mono"] #ambient { display: none; }
  html[data-theme="mono"] .card { backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
  html[data-theme="mono"] .card::after { display: none; }
  html[data-theme="mono"] .clock { font-weight: 200; letter-spacing: -0.02em; }
  html[data-theme="mono"] .clock .d { background: none; color: var(--text); -webkit-text-fill-color: var(--text); }
  html[data-theme="mono"] .weather-temp { font-weight: 300; }
  html[data-theme="mono"] .date-line { font-weight: 400; }
  html[data-theme="mono"] .kw-badge,
  html[data-theme="mono"] .weather-minmax { background: none; border: 1px solid var(--border); }
  html[data-theme="mono"] .weather-icon,
  html[data-theme="mono"] .sd-icon,
  html[data-theme="mono"] .set-btn .ico { filter: saturate(0.6); }
  html[data-theme="mono"] .art { box-shadow: 0 0 0 1px var(--border); }
  html[data-theme="mono"] .link-btn,
  html[data-theme="mono"] .modal-save { background: #fff; color: #000; }
  html[data-theme="mono"] li.done .check { color: #000; }
  html[data-theme="mono"] .sd-btn:hover,
  html[data-theme="mono"] .pl-row:hover,
  html[data-theme="mono"] .set-btn:hover { background: #1e1e1e; }
  html[data-theme="mono"] .modal-box { background: #0a0a0a; }
  html[data-theme="mono"] #netPill { background: #fff; color: #000; }

  /* ===== Theme: Nord (kühles Blaugrau) ===== */
  html[data-theme="nord"] {
    --bg-a:#2e3440; --bg-b:#242933;
    --blob1: rgba(136,192,208,0.16); --blob2: rgba(163,190,140,0.08); --blob3: rgba(129,161,193,0.12);
    --glass: rgba(236,239,244,0.05); --glass-strong: rgba(236,239,244,0.09);
    --border: rgba(216,222,233,0.13);
    --text:#eceff4; --sub:#9aa5b8;
    --violet:#88c0d0; --violet-soft: rgba(136,192,208,0.18);
    --number-font: 'Inter', sans-serif; --font-text: 'Inter', sans-serif;
    --radius: 14px;
    --s-neu:#a3acbd; --s-arbeit:#88c0d0; --s-wartet:#ebcb8b; --s-fertig:#a3be8c; --art-neu:#b48ead; --art-umbau:#8fbcbb;
  }
  html[data-theme="nord"] .clock .d { background: linear-gradient(120deg,#eceff4,#88c0d0); -webkit-background-clip:text; background-clip:text; }
  html[data-theme="nord"] .clock { font-weight: 700; }
  html[data-theme="nord"] .link-btn, html[data-theme="nord"] .modal-save { color: #1d2430; }

  /* ===== Theme: Wald (dunkelgrün, natürlich) ===== */
  html[data-theme="forest"] {
    --bg-a:#0f1a14; --bg-b:#16261d;
    --blob1: rgba(120,180,120,0.16); --blob2: rgba(200,170,90,0.10); --blob3: rgba(80,140,110,0.12);
    --glass: rgba(230,240,220,0.05); --glass-strong: rgba(230,240,220,0.09);
    --border: rgba(200,220,180,0.13);
    --text:#ecf2e6; --sub:#9db09a;
    --violet:#a7c957; --violet-soft: rgba(167,201,87,0.18);
    --number-font: 'Space Grotesk', sans-serif;
    --radius: 18px;
    --s-neu:#9aa592; --s-arbeit:#7fc4d9; --s-wartet:#e3c06a; --s-fertig:#a7c957; --art-neu:#c9a7e3; --art-umbau:#6cc4a8;
  }
  html[data-theme="forest"] .clock .d { background: linear-gradient(120deg,#f1f7e7,#a7c957); -webkit-background-clip:text; background-clip:text; }
  html[data-theme="forest"] .link-btn, html[data-theme="forest"] .modal-save { color: #142012; }

  /* ---------- Aussehen-Schalter (aus dem Zahnrad-Menü) ---------- */
  html.no-cover body { --cover: var(--violet) !important; }
  html.hide-kw .kw-badge { display: none; }
  html.clock-sec { --clock-sec: 0.72; }
  html.no-anim *, html.no-anim *::before, html.no-anim *::after { animation: none !important; transition: none !important; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text);
    font-family: var(--font-text, -apple-system, 'Segoe UI', Roboto, sans-serif);
    padding: calc(var(--gap, 12px) + 2px); display: flex; flex-direction: row; gap: var(--gap, 12px); overflow: hidden;
    background:
      radial-gradient(circle at 12% 18%, var(--blob1), transparent 45%),
      radial-gradient(circle at 88% 82%, var(--blob2), transparent 50%),
      radial-gradient(circle at 85% 10%, var(--blob3), transparent 40%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b));
    background-attachment: fixed;
    transition: background 0.4s ease, --cover 4s ease;   /* langsam: Farbwechsel soll im Augenwinkel nicht auffallen */
    /* Keine Browser-Spuren: nichts markierbar */
    user-select: none; -webkit-user-select: none;
  }
  input, textarea { user-select: text; -webkit-user-select: text; }
  img { -webkit-user-drag: none; }
  body.hide-cursor, body.hide-cursor * { cursor: none !important; }

  /* Farbschein passend zum Albumcover */
  #ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 28% 82%, color-mix(in srgb, var(--cover) 22%, transparent), transparent 55%),
      radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--cover) 14%, transparent), transparent 45%); }
  .col-left, .col-right { position: relative; z-index: 1; }

  button, input { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font-family: inherit; user-select: none; }
  .card {
    background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); position: relative; overflow: hidden;
    container-type: size; container-name: card;
    transition: border-radius 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  /* Deko-Wasserzeichen (🕐 ☁️ ♫ 🚀) dürfen nie Klicks abfangen */
  .card::after { pointer-events: none; }
  h2 { font-size: calc(clamp(0.8rem, min(3.4cqi, 5.5cqb), 1.05rem) * var(--fs, 1)); font-weight: 600; color: var(--sub); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

  /* Spalten */
  .col-left { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--gap, 12px); min-width: 0; min-height: 0; }
  .col-right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .col-left .card { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 8px; min-width: 0; min-height: 0; }

  /* Oben links: Uhrzeit/Datum/KW */
  .time-card { gap: min(2cqi, 3cqb); }
  .time-card::after {
    content: '🕐'; position: absolute; right: -20px; bottom: -30px; font-size: 7rem; opacity: 0.06;
  }
  .clock { font-family: var(--number-font); font-weight: 800; font-size: calc(clamp(1.6rem, min(19cqi, 26cqb), 7rem) * var(--fs-clock, 1) * var(--clock-sec, 1)); line-height: 1;
    display: flex; font-variant-numeric: tabular-nums; overflow: hidden; padding: 0.05em 0; }
  .clock .d { display: inline-block;
    background: linear-gradient(120deg, #fff, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .clock .d.roll { animation: roll 0.5s cubic-bezier(.2,.8,.2,1); }
  @keyframes roll { from { transform: translateY(-55%); opacity: 0; } to { transform: none; opacity: 1; } }
  .date-line { color: var(--text); font-size: calc(clamp(0.8rem, min(7cqi, 9cqb), 1.5rem) * var(--fs, 1)); font-weight: 600; }
  .kw-badge { color: var(--sub); font-size: calc(clamp(0.75rem, min(4.5cqi, 6cqb), 1rem) * var(--fs, 1)); font-weight: 600; padding: 0.8cqi 3cqi; background: var(--violet-soft); border-radius: 20px; }

  /* Wetter */
  .weather-card::after {
    content: '☁️'; position: absolute; left: -25px; top: -25px; font-size: 6rem; opacity: 0.06;
  }
  .weather-temp { font-family: var(--number-font); font-size: calc(clamp(1.6rem, min(20cqi, 28cqb), 3.4rem) * var(--fs, 1)); font-weight: 700; }
  .weather-desc { color: var(--sub); font-size: calc(clamp(0.75rem, min(6cqi, 8.5cqb), 1rem) * var(--fs, 1)); }
  .weather-minmax { color: var(--sub); font-size: calc(clamp(0.75rem, min(5cqi, 7.5cqb), 0.95rem) * var(--fs, 1)); padding: 0.6cqi 2.5cqi; background: var(--weather-soft); border-radius: 20px; margin-top: 2px; }
  .weather-icon { font-size: calc(clamp(1.8rem, min(24cqi, 30cqb), 3.8rem) * var(--fs, 1)); filter: drop-shadow(0 4px 10px rgba(245,185,92,0.35)); }

  /* Spotify */
  .spotify-card::after {
    content: '♫'; position: absolute; right: -15px; bottom: -35px; font-size: 8rem; opacity: 0.07; color: var(--cover);
  }
  .art { width: clamp(64px, min(34cqi, 42cqb), 130px); height: clamp(64px, min(34cqi, 42cqb), 130px); border-radius: calc(var(--radius) * 0.7); background: var(--glass-strong); object-fit: cover; flex-shrink: 0;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--cover) 35%, transparent), 0 8px 26px color-mix(in srgb, var(--cover) 45%, transparent); }
  .track { font-weight: 700; font-size: calc(clamp(0.8rem, min(7cqi, 10cqb), 1.15rem) * var(--fs, 1)); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--sub); font-size: calc(clamp(0.75rem, min(6cqi, 8.5cqb), 1rem) * var(--fs, 1)); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--cover); transition: width 0.8s linear; }
  .controls { display: flex; align-items: center; gap: min(2.5cqi, 4cqb); }
  .ctrl-btn { background: var(--glass-strong); border: 1px solid var(--border); color: var(--text); border-radius: 50%;
    width: clamp(34px, min(13cqi, 18cqb), 46px); height: clamp(34px, min(13cqi, 18cqb), 46px); font-size: calc(clamp(0.85rem, min(6cqi, 8.5cqb), 1.05rem) * var(--fs, 1)); cursor: pointer;
    transition: transform 0.15s ease; }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.main { width: clamp(40px, min(16cqi, 22cqb), 54px); height: clamp(40px, min(16cqi, 22cqb), 54px); background: var(--cover); border: none; font-size: calc(clamp(0.9rem, min(7cqi, 9.5cqb), 1.15rem) * var(--fs, 1)); color: #0b0b10; }
  .ctrl-btn.heart { color: var(--sub); background: none; border: none; width: clamp(34px, min(13cqi,18cqb), 44px); height: clamp(34px, min(13cqi,18cqb), 44px); font-size: calc(clamp(0.95rem, min(8cqi, 10.5cqb), 1.25rem) * var(--fs, 1)); display: flex; align-items: center; justify-content: center; }
  .ctrl-btn.heart.liked { color: #ff5c8a; }
  .conn-note { font-size: calc(clamp(0.75rem, min(3.5cqi, 6cqb), 0.72rem) * var(--fs, 1)); color: var(--sub); }
  .conn-note button { margin-top: 4px; }
  .link-btn { background: var(--violet); color: #fff; border: none; border-radius: 30px; padding: 9px 18px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
  .settings { display: flex; flex-direction: column; gap: 8px; width: 95%; }
  .settings label { font-size: 0.75rem; color: var(--sub); text-align: left; }
  input[type=text] { background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 11px 13px; font-size: 0.9rem; }
  .flip-btn { background: var(--glass-strong); border: 1px solid var(--border); color: var(--text); border-radius: 50%;
    width: clamp(26px, min(10cqi, 14cqb), 32px); height: clamp(26px, min(10cqi, 14cqb), 32px); font-size: calc(clamp(0.75rem, min(5cqi, 7cqb), 0.85rem) * var(--fs, 1));
    cursor: pointer; position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 0;
    opacity: 0.6; transition: opacity 0.2s ease; }
  .flip-btn:hover { opacity: 1; }
  .pl-view { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; }
  .pl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-right: 36px; }
  .pl-header h3 { margin: 0; font-size: calc(clamp(0.8rem, 3cqi, 1rem) * var(--fs, 1)); color: var(--text); }
  .pl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; width: 100%; text-align: left; }
  .pl-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--glass-strong); border: 1px solid var(--border);
    border-radius: calc(var(--radius) * 0.6); cursor: pointer; }
  .pl-row:hover { background: rgba(255,255,255,0.16); }
  .pl-art { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; background: var(--bg-a); flex-shrink: 0; }
  .pl-name { font-size: calc(clamp(0.78rem, 2.4cqi, 0.95rem) * var(--fs, 1)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Weiches Einblenden beim Seitenwechsel einer Kachel */
  .swap-in { animation: swapIn 0.5s cubic-bezier(.2,.8,.2,1); }
  @keyframes swapIn { from { opacity: 0; transform: perspective(700px) rotateY(-14deg) scale(0.97); } to { opacity: 1; transform: none; } }

  /* ToDo rechts, volle Höhe */
  .todo-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  form input[type=text] { flex: 1; font-size: calc(clamp(0.9rem, 2.3cqi, 1.1rem) * var(--fs, 1)); padding: 10px 14px; }
  form .link-btn { font-size: calc(clamp(0.95rem, 2.4cqi, 1.15rem) * var(--fs, 1)); padding: 10px 20px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
  /* Keine Scrollbalken - scrollen geht trotzdem per Mausrad */
  ul, .pl-list { scrollbar-width: none; }
  ul::-webkit-scrollbar, .pl-list::-webkit-scrollbar { display: none; }
  li { display: flex; align-items: center; gap: 10px; padding: clamp(8px, 1.6cqi, 16px) clamp(10px, 2cqi, 18px); background: var(--glass-strong); border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.7);
    animation: liIn 0.35s ease; }
  @keyframes liIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  li.done { opacity: 0.6; }
  li.done .label { text-decoration: line-through; color: var(--sub); }
  .label { flex: 1; word-break: break-word; font-size: calc(clamp(0.95rem, 2.3cqi, 1.2rem) * var(--fs, 1)); }
  .check { width: clamp(26px, 2.8cqi, 30px); height: clamp(26px, 2.8cqi, 30px); border-radius: 50%; border: 2px solid var(--violet); cursor: pointer; flex-shrink: 0; background: none; color: #fff; font-size: calc(clamp(0.75rem, 1.6cqi, 0.9rem) * var(--fs, 1)); display: flex; align-items: center; justify-content: center; }

  .status { font-size: calc(clamp(0.75rem, 2cqi, 0.8rem) * var(--fs, 1)); color: var(--sub); text-align: right; min-height: 1em; padding-right: 36px; }

  /* Streamdeck / Schnellzugriff */
  .streamdeck-card { align-items: stretch !important; text-align: left !important; justify-content: stretch !important; position: relative; }
  .streamdeck-card.edit-mode { padding-top: 40px; }
  .streamdeck-card::after {
    content: '🚀'; position: absolute; left: -20px; top: -25px; font-size: 6.5rem; opacity: 0.06;
  }
  .sd-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: min(2.2cqi, 3.2cqb); flex: 1; min-height: 0; min-width: 0; }
  .sd-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--glass-strong); border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.6);
    cursor: pointer; color: var(--text); padding: 4px; position: relative; overflow: hidden;
    min-width: 0; min-height: 0; transition: transform 0.15s ease, background 0.2s ease; }
  .sd-btn:hover { background: rgba(255,255,255,0.15); }
  .sd-btn:active { transform: scale(0.94); }
  .sd-btn .sd-icon { font-size: calc(clamp(0.75rem, min(11cqi, 15cqb), 1.8rem) * var(--fs, 1)); min-width: 0; }
  .sd-btn .sd-label { font-size: calc(clamp(0.75rem, min(4cqi, 5.5cqb), 0.75rem) * var(--fs, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; min-width: 0; }
  /* Bearbeiten-Knöpfe auf den Kacheln: 24 px statt 15 px, damit sie mit der Maus gut treffbar sind */
  .sd-remove { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,90,90,0.95); color: #fff; font-size: 0.8rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; padding: 0; }
  .sd-edit { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.92); color: #222; font-size: 0.8rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; padding: 0; }
  .sd-move { position: absolute; bottom: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.8); color: #222; font-size: 0.75rem; line-height: 1; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 2; padding: 0; }
  .sd-move-left { left: 3px; }
  .sd-move-right { right: 3px; }
  .streamdeck-card.edit-mode .sd-icon, .streamdeck-card.edit-mode .sd-label { opacity: 0.35; }
  .sd-move[disabled] { opacity: 0.3; cursor: not-allowed; }
  .streamdeck-card.edit-mode .sd-remove,
  .streamdeck-card.edit-mode .sd-edit,
  .streamdeck-card.edit-mode .sd-move { display: flex; }
  .streamdeck-card.edit-mode .sd-btn { opacity: 0.85; }
  .sd-edit-bar { display: none !important; }
  .streamdeck-card.edit-mode .sd-edit-bar { display: flex !important; }

  /* Ecken-Buttons */
  .corner-toolbar { position: absolute; top: 10px; z-index: 5; display: flex; gap: 6px; }
  .corner-toolbar.right { right: 10px; }
  .corner-btn { min-width: 26px; height: 26px; border-radius: 13px;
    background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); font-size: 0.78rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 9px; }
  .corner-btn:hover { background: rgba(255,255,255,0.18); }

  /* Zahnrad: einziger sichtbarer Einstieg in alle Einstellungen */
  /* Zahnrad oben rechts - dort, wo die Maus von den Monitoren darüber ankommt */
  .gear-btn { position: absolute; right: 12px; top: 14px; width: 34px; height: 34px; border-radius: 50%; z-index: 5;
    background: none; border: none; color: var(--sub); font-size: 1.15rem; opacity: 0.4; cursor: pointer;
    transition: opacity 0.25s ease, transform 0.5s ease; display: flex; align-items: center; justify-content: center; padding: 0; }
  .gear-btn:hover { opacity: 1; transform: rotate(60deg); }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; visibility: hidden; opacity: 0;
    align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.25s ease, visibility 0.25s; }
  .modal-overlay.open { visibility: visible; opacity: 1; }
  .modal-box { background: var(--bg-b); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; width: min(320px, 85vw); max-height: 90vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) transparent;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(10px) scale(0.98); transition: transform 0.25s ease; }
  .modal-overlay.open .modal-box { transform: none; }
  .modal-box h3 { margin: 0 0 14px; font-size: 1rem; color: var(--text); }
  .modal-box label { display: block; font-size: 0.75rem; color: var(--sub); margin: 10px 0 4px; }
  .modal-box input[type=text] { width: 100%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 12px; border: none; cursor: pointer; font-size: 0.9rem; }
  .modal-save { background: var(--violet); color: #fff; font-weight: 600; }
  .modal-cancel { background: rgba(255,255,255,0.1); color: var(--text); }
  .set-list { display: flex; flex-direction: column; gap: 5px; }
  .modal-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.1); color: var(--text); font-size: 0.85rem; cursor: pointer; }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .set-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.86rem; cursor: pointer; }
  .set-btn:hover { background: rgba(255,255,255,0.12); }
  .set-btn .ico { width: 20px; text-align: center; }
  .set-btn small { margin-left: auto; color: var(--sub); font-size: 0.75rem; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-btn.active { border-color: var(--violet); background: var(--violet-soft); }
  .set-sep { height: 1px; background: var(--border); margin: 4px 0; }
  .theme-opt { padding: 8px 10px; gap: 12px; }
  .theme-swatch { width: 46px; height: 32px; border-radius: 8px; flex-shrink: 0; position: relative; border: 1px solid rgba(128,128,128,0.35); }
  .theme-swatch i { position: absolute; right: 5px; bottom: 5px; width: 10px; height: 10px; border-radius: 50%; }
  .theme-txt { display: flex; flex-direction: column; min-width: 0; }
  .theme-txt b { font-weight: 600; }
  .theme-txt small { margin-left: 0 !important; max-width: none !important; color: var(--sub); font-size: 0.75rem; }
  .set-note { font-size: 0.78rem; color: var(--sub); margin: 0 0 12px; line-height: 1.45; }

  /* Aussehen-Panel: Menü rückt nach rechts, Dashboard bleibt sichtbar für Live-Vorschau */
  .modal-overlay.see-through { background: rgba(0,0,0,0.12); backdrop-filter: none; -webkit-backdrop-filter: none;
    justify-content: flex-end; padding-right: 16px; }
  .modal-box { color-scheme: dark; }
  .ap-group { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sub); margin: 14px 0 4px; }
  .ap-group:first-child { margin-top: 0; }
  .ap-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 0.84rem; color: var(--text); }
  .ap-row > span:first-child { flex: 1; }
  .ap-ctrl { display: flex; align-items: center; gap: 8px; }
  .ap-row input[type=range] { width: 120px; accent-color: var(--violet); cursor: pointer; }
  .ap-val { min-width: 40px; text-align: right; color: var(--sub); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .ap-row select { background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; font-size: 0.8rem; max-width: 165px; cursor: pointer; }
  .sw { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 22px; margin: 0;
    background: rgba(255,255,255,0.15); position: relative; cursor: pointer; transition: background 0.2s ease; flex-shrink: 0; }
  .sw::before { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform 0.2s ease; }
  .sw:checked { background: var(--violet); }
  .sw:checked::before { transform: translateX(16px); }
  html[data-theme="mono"] .sw:checked::before { background: #000; }
  .ap-color { width: 34px; height: 24px; border: 1px solid var(--border); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .ap-mini { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    font-size: 0.75rem; padding: 4px 8px; cursor: pointer; }

  /* Startbildschirm */
  #splash { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b)); transition: opacity 0.7s ease, visibility 0.7s; }
  #splash.gone { opacity: 0; visibility: hidden; }
  /* Logo = Grundriss des Dashboards: 4 Kacheln links, 1 hohe rechts.
     Die Kacheln leuchten nacheinander auf und ersetzen den Ladebalken. */
  .splash-logo { width: 104px; height: 52px; overflow: visible; }
  .splash-logo .t { fill: transparent; stroke: var(--sub); stroke-width: 1.4; animation: tile 1.8s ease-in-out infinite; }
  .splash-logo .t2 { animation-delay: 0.15s; }
  .splash-logo .t3 { animation-delay: 0.3s; }
  .splash-logo .t4 { animation-delay: 0.45s; }
  .splash-logo .t5 { animation-delay: 0.6s; }
  @keyframes tile {
    0%, 100% { fill: transparent; stroke: var(--sub); }
    25%, 55% { fill: var(--violet); stroke: var(--violet); }
  }
  .splash-name { font-family: 'Outfit', sans-serif; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--sub); font-size: 0.75rem; padding-left: 0.5em; }

  /* Verbindungsanzeige */
  #netPill { position: fixed; left: 50%; top: 10px; z-index: 150; transform: translate(-50%, -250%); opacity: 0;
    padding: 6px 14px; border-radius: 20px; background: rgba(220,70,70,0.92); color: #fff; font-size: 0.75rem; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35); transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease; pointer-events: none; white-space: nowrap; }
  #netPill.show { transform: translate(-50%, 0); opacity: 1; }
  #netPill.warn { background: rgba(230,150,40,0.95); }

  /* ---------- StandBy-Modus ---------- */
  #standby { position: fixed; inset: 0; z-index: 250; display: flex; align-items: center; justify-content: center; gap: 6vw; padding: 5vh 6vw;
    background: var(--bg-a); opacity: 0; visibility: hidden; transition: opacity 0.8s ease, visibility 0.8s; cursor: none; overflow: hidden; }
  #standby.on { opacity: 1; visibility: visible; }
  #standby::before { content: ''; position: absolute; inset: -10%; background-image: var(--sb-bg, none); background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.3); opacity: 0.35; transform: scale(1.1); transition: opacity 1s ease; }
  #standby.no-music::before { opacity: 0; }
  #standby::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); }
  #standby > * { position: relative; z-index: 1; }
  .sb-left { display: flex; flex-direction: column; align-items: flex-start; }
  #standby.no-music .sb-left { align-items: center; }
  .sb-clock { font-family: var(--number-font); font-weight: 700; line-height: 0.95; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    font-size: calc(min(17vw, 34vh) * var(--fs-clock, 1) * var(--clock-sec, 1)); }
  #standby.no-music .sb-clock { font-size: calc(min(24vw, 45vh) * var(--fs-clock, 1) * var(--clock-sec, 1)); }
  .sb-date { color: var(--sub); font-size: calc(min(2.6vw, 5vh) * var(--fs, 1)); margin-top: 1.5vh; }
  .sb-right { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  #standby.no-music .sb-right { display: none; }
  .sb-art { width: min(26vw, 52vh); height: min(26vw, 52vh); border-radius: calc(var(--radius) * 0.8); object-fit: cover;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); background: var(--glass-strong); transition: opacity 0.6s ease; }
  #standby.paused .sb-art { opacity: 0.55; }
  .sb-track { color: var(--text); font-weight: 700; font-size: calc(min(2.4vw, 4.6vh) * var(--fs, 1)); margin-top: 2.2vh;
    max-width: min(26vw, 52vh); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-artist { color: var(--sub); font-size: calc(min(1.9vw, 3.6vh) * var(--fs, 1)); margin-top: 0.5vh;
    max-width: min(26vw, 52vh); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-progress { width: min(26vw, 52vh); height: 3px; border-radius: 3px; background: rgba(255,255,255,0.15); margin-top: 1.8vh; overflow: hidden; }
  .sb-progress div { height: 100%; width: 0; background: var(--cover); transition: width 1s linear; }
  html[data-theme="mono"] #standby::before { display: none; }
  html[data-theme="mono"] .sb-clock { font-weight: 200; }

  /* ---------- Spotify-Ausbau ---------- */
  .ctrl-btn.mini { background: none; border: none; color: var(--sub); padding: 0; position: relative;
    width: clamp(26px, min(10cqi, 14cqb), 34px); height: clamp(26px, min(10cqi, 14cqb), 34px); display: flex; align-items: center; justify-content: center; }
  .ctrl-btn.mini svg { width: 60%; height: 60%; }
  .ctrl-btn.mini.on { color: var(--cover); }
  .ctrl-btn.mini .rep1 { position: absolute; right: 1px; bottom: 1px; font-size: 0.5rem; font-weight: 800; }
  .ctrl-btn.heart.heart-corner { position: absolute; top: 8px; left: 8px; z-index: 3; }
  /* Spotify-Seiten als Reiter - gleiches Bedienmuster wie "To-Dos | Aufträge" */
  .sp-switch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 2px;
    background: rgba(0,0,0,0.18); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .sp-switch button { width: 32px; height: 28px; border: none; background: none; color: var(--sub); border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .sp-switch button svg { width: 16px; height: 16px; }
  .sp-switch button:hover { color: var(--text); }
  .sp-switch button.active { background: var(--glass-strong); color: var(--text); }
  .spotify-card { padding-top: 46px !important; }
  .spotify-card .pl-view { padding-top: 0; }
  .sp-title { color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 2px 6px;
    font-size: calc(clamp(0.75rem, 2cqi, 0.8rem) * var(--fs, 1)); }
  .pl-tabs { display: flex; gap: 4px; margin-bottom: 8px; padding-right: 36px; }
  .pl-tab { flex: 1; background: none; border: 1px solid transparent; color: var(--sub); border-radius: 10px; padding: 5px 4px; cursor: pointer; white-space: nowrap;
    font-size: calc(clamp(0.75rem, 2.8cqi, 0.8rem) * var(--fs, 1)); }
  .pl-tab.active { background: var(--glass-strong); border-color: var(--border); color: var(--text); }
  .pl-txt { min-width: 0; display: flex; flex-direction: column; }
  .pl-sub { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(clamp(0.75rem, 2.2cqi, 0.74rem) * var(--fs, 1)); }
  .pl-row.active { border-color: var(--cover); }
  .pl-row.static { cursor: default; }
  .pl-row.static:hover { background: var(--glass-strong); }
  .pl-ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
  .vol-row { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; color: var(--sub); font-size: calc(clamp(0.75rem, 2.6cqi, 0.85rem) * var(--fs, 1)); }
  .vol-row input { flex: 1; accent-color: var(--cover); cursor: pointer; }
  .vol-row .ap-val { min-width: 34px; }
  .pl-list li.pl-group { background: none; border: none; padding: 4px 2px 0; animation: none; color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em;
    font-size: calc(clamp(0.75rem, 2cqi, 0.68rem) * var(--fs, 1)); }

  /* ---------- To-Do-Ausbau ---------- */
  .todo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -2px 2px 8px; color: var(--sub);
    font-size: calc(clamp(0.75rem, 1.8cqi, 0.85rem) * var(--fs, 1)); min-height: 1.6em; }
  .todo-head .tbtns { display: flex; gap: 4px; }
  .tbtn { background: none; border: none; color: var(--sub); font-size: inherit; cursor: pointer; padding: 3px 8px; border-radius: 8px; }
  .tbtn:hover { color: var(--text); background: var(--glass-strong); }
  #list li { cursor: grab; position: relative; }
  #list li.dragging { opacity: 0.35; }
  #list li.drop-before { box-shadow: 0 -3px 0 0 var(--violet); }
  #list li.drop-after { box-shadow: 0 3px 0 0 var(--violet); }
  /* Priorität: Farbe UND Ziffer, damit sie auch ohne Farbe (Minimal-Theme, Blendung) erkennbar ist */
  .prio { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--sub); background: none; cursor: pointer; flex-shrink: 0; padding: 0; opacity: 0.45;
    transition: opacity 0.2s ease, transform 0.15s ease; font-size: 0.75rem; font-weight: 800; color: #111; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .prio:hover { opacity: 1; transform: scale(1.1); }
  li[data-prio] { border-left: 4px solid var(--prio); }
  li[data-prio] .prio { border: none; background: var(--prio); opacity: 1; }
  li.prio-red { --prio: #ff5a5a; } li.prio-amber { --prio: #f5b95c; } li.prio-blue { --prio: #5bb8ff; }
  html[data-theme="mono"] li.prio-red { --prio: #e8696b; }
  html[data-theme="mono"] li.prio-amber { --prio: #dcae5e; }
  html[data-theme="mono"] li.prio-blue { --prio: #6ea9db; }

  /* ---------- Rechte Kachel: Umschalter To-Dos / Aufträge ---------- */
  .hidden { display: none !important; }
  .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  /* Display unter den Monitoren: Spotify + Schnellzugriff (oft geklickt) in die obere Reihe */
  html.actions-top .spotify-card { order: -2; }
  html.actions-top .streamdeck-card { order: -1; }

  .todo-switch { display: flex; gap: 3px; background: rgba(0,0,0,0.18); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 10px; align-self: flex-start; }
  .todo-switch button { background: none; border: none; color: var(--sub); padding: 6px 14px; border-radius: 9px; cursor: pointer; font-weight: 600;
    font-size: calc(clamp(0.78rem, 1.9cqi, 0.95rem) * var(--fs, 1)); display: flex; align-items: center; gap: 6px; }
  .todo-switch button.active { background: var(--glass-strong); color: var(--text); }
  .sw-count { font-size: 0.72em; background: var(--violet-soft); color: var(--violet); border-radius: 10px; padding: 1px 7px; }
  .sw-count:empty { display: none; }

  /* ---------- Aufträge ---------- */
  :root { --s-neu: #9aa0b2; --s-arbeit: #5bb8ff; --s-wartet: #f5b95c; --s-fertig: #3ecf8e; --art-neu: #b3a8ff; --art-umbau: #4fd1c5; }
  html[data-theme="mono"] { --s-neu: #8a8f99; --s-arbeit: #6ea9db; --s-wartet: #dcae5e; --s-fertig: #5fc28f; --art-neu: #a89ce8; --art-umbau: #5cbfb4; }
  .af-connect { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; }
  .af-connect-title { font-weight: 700; font-size: calc(clamp(0.95rem, 2.6cqi, 1.2rem) * var(--fs, 1)); }
  .af-connect p { color: var(--sub); margin: 0 0 6px; max-width: 360px; line-height: 1.5; font-size: calc(clamp(0.78rem, 1.9cqi, 0.92rem) * var(--fs, 1)); }
  .af-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
  .af-top { display: flex; gap: 8px; margin-bottom: 8px; }
  .af-top input { flex: 1; min-width: 0; font-size: calc(clamp(0.85rem, 2.1cqi, 1rem) * var(--fs, 1)); padding: 9px 13px; }
  .af-top .link-btn { padding: 8px 18px; font-size: calc(clamp(0.95rem, 2.4cqi, 1.15rem) * var(--fs, 1)); }
  .af-sub { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .af-chip { background: none; border: 1px solid transparent; color: var(--sub); border-radius: 10px; padding: 4px 11px; cursor: pointer;
    font-size: calc(clamp(0.75rem, 1.8cqi, 0.86rem) * var(--fs, 1)); display: flex; align-items: center; gap: 6px; }
  .af-chip b { font-weight: 600; font-size: 0.85em; opacity: 0.8; }
  .af-chip.active { background: var(--glass-strong); border-color: var(--border); color: var(--text); }
  .af-saved { margin-left: auto; color: var(--sub); font-size: calc(clamp(0.75rem, 1.5cqi, 0.72rem) * var(--fs, 1)); white-space: nowrap; }
  .af-saved.err { color: #ff6b6b; }
  /* Statusfarbe als Streifen links: auf einen Blick sehen, was hängt */
  #afList li { flex-direction: column; align-items: stretch; gap: 5px; cursor: pointer; transition: background 0.15s ease, opacity 0.3s ease;
    border-left: 5px solid var(--c, var(--border)); }
  #afList li:hover { background: rgba(255,255,255,0.14); }
  #afList li.leaving { opacity: 0; }
  #afList li.flash { animation: afFlash 1.4s ease; }
  @keyframes afFlash { 0%, 40% { background: var(--violet-soft); } }
  .af-l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .af-kunde { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(clamp(0.9rem, 2.2cqi, 1.1rem) * var(--fs, 1)); }
  .af-nr { color: var(--sub); font-variant-numeric: tabular-nums; font-size: calc(clamp(0.78rem, 1.9cqi, 0.95rem) * var(--fs, 1)); }
  .af-l2 { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--sub); font-size: calc(clamp(0.75rem, 1.8cqi, 0.86rem) * var(--fs, 1)); }
  .af-notes { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .af-art { flex-shrink: 0; font-weight: 600; font-size: 0.9em; padding: 1px 8px; border-radius: 20px; color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .af-art.Neumaschine { --c: var(--art-neu); } .af-art.Umbau { --c: var(--art-umbau); }
  .af-date { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .af-status { appearance: none; -webkit-appearance: none; flex-shrink: 0; cursor: pointer; outline: none; font-weight: 600;
    font-size: calc(clamp(0.75rem, 1.7cqi, 0.82rem) * var(--fs, 1)); border-radius: 20px; padding: 3px 10px 3px 20px; color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background-color: color-mix(in srgb, var(--c) 13%, transparent);
    background-image: radial-gradient(circle at 10px 50%, var(--c) 3.5px, transparent 4px); background-repeat: no-repeat; }
  .af-status option { color: #111; background: #fff; }
  .st-Neu { --c: var(--s-neu); } .st-InArbeit { --c: var(--s-arbeit); } .st-Wartet { --c: var(--s-wartet); } .st-Fertig { --c: var(--s-fertig); }
  .af-empty { color: var(--sub); text-align: center; padding: 30px 10px; font-size: calc(clamp(0.8rem, 2cqi, 0.95rem) * var(--fs, 1)); }
  .af-empty b { display: block; color: var(--text); margin-bottom: 4px; }
  #afList mark { background: rgba(245,185,92,0.35); color: inherit; border-radius: 3px; }

  .af-modal { width: min(440px, 92vw) !important; position: relative; padding: 18px 20px !important; }
  .af-modal label { margin: 9px 0 4px !important; }
  .af-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  .af-grid input, .af-modal textarea, .af-path-row input { width: 100%; }
  .af-modal textarea { background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 0.88rem; resize: vertical; min-height: 84px; }
  .af-choice { display: flex; gap: 5px; }
  .af-choice button { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--sub); border-radius: 10px; padding: 7px 4px; cursor: pointer; font-size: 0.8rem; }
  .af-choice button.active { color: var(--c, var(--violet)); border-color: var(--c, var(--violet)); background: color-mix(in srgb, var(--c, var(--violet)) 14%, transparent); font-weight: 600; }
  .af-choice button[data-v="Neumaschine"] { --c: var(--art-neu); } .af-choice button[data-v="Umbau"] { --c: var(--art-umbau); }
  .af-choice button[data-v="Neu"] { --c: var(--s-neu); } .af-choice button[data-v="In Arbeit"] { --c: var(--s-arbeit); }
  .af-choice button[data-v="Wartet"] { --c: var(--s-wartet); } .af-choice button[data-v="Fertig"] { --c: var(--s-fertig); }
  .af-path-row { display: flex; gap: 6px; align-items: center; }
  .af-path-row .corner-btn { height: 40px; min-width: 40px; border-radius: 10px; }
  .af-mono { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 0.82rem !important; }
  .af-meta { color: var(--sub); font-size: 0.75rem; margin-top: 8px; }
  .af-modal .invalid { border-color: #ff6b6b !important; }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 160%); z-index: 160; display: flex; align-items: center; gap: 14px;
    background: #1b1e29; color: #eef0f6; border: 1px solid #343a4c; border-radius: 12px; padding: 9px 14px; font-size: 0.82rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.25s ease; pointer-events: none; max-width: 90vw; opacity: 0; }
  #toast.show { transform: translate(-50%, 0); pointer-events: auto; opacity: 1; }
  #toast button { background: none; border: none; color: #b3a8ff; font-weight: 700; cursor: pointer; padding: 0; font-size: inherit; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div id="splash">
    <svg class="splash-logo" viewBox="0 0 56 28" aria-hidden="true">
      <rect class="t t1" x="1" y="1" width="11" height="11" rx="2.5"/>
      <rect class="t t2" x="16" y="1" width="11" height="11" rx="2.5"/>
      <rect class="t t3" x="1" y="16" width="11" height="11" rx="2.5"/>
      <rect class="t t4" x="16" y="16" width="11" height="11" rx="2.5"/>
      <rect class="t t5" x="32" y="1" width="23" height="26" rx="2.5"/>
    </svg>
    <div class="splash-name">Dashboard</div>
  </div>
  <div id="ambient"></div>
  <div id="netPill"></div>
  <div id="standby" class="no-music">
    <div class="sb-left">
      <div class="sb-clock" id="sbClock"></div>
      <div class="sb-date" id="sbDate"></div>
    </div>
    <div class="sb-right">
      <img class="sb-art" id="sbArt" alt="">
      <div class="sb-track" id="sbTrack"></div>
      <div class="sb-artist" id="sbArtist"></div>
      <div class="sb-progress"><div id="sbFill"></div></div>
    </div>
  </div>

  <div class="col-left">
    <div class="card time-card">
      <div class="clock" id="clock"></div>
      <div class="date-line" id="date"></div>
      <div class="kw-badge" id="kw"></div>
    </div>
    <div class="card weather-card" id="weatherCard"><div class="weather-desc">Wetter lädt…</div></div>
    <div class="card spotify-card" id="spotifyCard"></div>
    <div class="card streamdeck-card" id="streamdeckCard">
      <div class="corner-toolbar right sd-edit-bar">
        <button class="corner-btn" id="sdAddBtn" title="Kachel hinzufügen">+</button>
        <button class="corner-btn" id="sdDoneBtn">Fertig</button>

  <div class="col-right">
    <div class="card todo-card">
      <div class="todo-switch" id="viewSwitch">
        <button data-view="todos" class="active">To-Dos</button>
        <button data-view="auftraege">Aufträge <span class="sw-count" id="afSwitchCount"></span></button>
      </div>

      <!-- Seite 2: Aufträge aus der lokalen auftraege.json -->
      <div class="view hidden" id="afView">
        <div class="af-connect hidden" id="afConnect">
          <div class="af-connect-title" id="afConnectTitle">Auftragsordner verbinden</div>
          <p id="afConnectText">Wähle einmal den Ordner mit deiner <b>auftraege.json</b> (oder einen leeren Ordner für eine neue Liste). Danach reicht ein Klick.</p>
          <button class="link-btn" id="afConnectBtn">Ordner wählen</button>
          <button class="link-btn af-secondary hidden" id="afOtherBtn">Anderen Ordner wählen</button>
        </div>
        <div class="view hidden" id="afMain">
          <div class="af-top">
            <input type="text" id="afSearch" placeholder="Aufträge suchen …" autocomplete="off">
            <button class="link-btn" id="afAddBtn" title="Neuer Auftrag">+</button>
          </div>
          <div class="af-sub">
            <button class="af-chip active" data-tab="aktiv">Aktiv <b id="afCntA">0</b></button>
            <button class="af-chip" data-tab="fertig">Fertig <b id="afCntF">0</b></button>
            <span class="af-saved" id="afSaved"></span>
          </div>
          <ul id="afList"></ul>
          <div class="af-empty hidden" id="afEmpty"></div>
        </div>
      </div>

      <div class="view" id="todoView">
      <form id="form">
        <input type="text" id="newTodo" placeholder="Neue Aufgabe…" autocomplete="off">

      </div>
      <div class="status" id="status"></div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">

  </div>

  <div class="modal-overlay" id="tileModal">
    <div class="modal-box">

      <label>Name</label>

    <div class="modal-box af-modal">

      <div class="af-grid">
        <div><label>Kunde</label><input type="text" id="afKunde" list="afKundenList" autocomplete="off"><datalist id="afKundenList"></datalist></div>

      <div class="af-choice" id="afArtChoice">
        <button type="button" data-v="Neumaschine">Neumaschine</button>
        <button type="button" data-v="Umbau">Umbau</button>
      </div>
      <label>Status</label>
      <div class="af-choice" id="afStatusChoice">
        <button type="button" data-v="Neu">Neu</button>
        <button type="button" data-v="In Arbeit">In Arbeit</button>
        <button type="button" data-v="Wartet">Wartet</button>
        <button type="button" data-v="Fertig">Fertig</button>
      </div>

      <div class="af-path-row">
        <input type="text" id="afPfad" class="af-mono" autocomplete="off" placeholder="W:\…">
        <button type="button" class="corner-btn" id="afCopyPath" title="Pfad kopieren">⧉</button>
      </div>
      <label>Notizen</label>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box" style="width:min(360px, 90vw); position:relative; padding:16px 18px;">
      <button class="modal-close" id="settingsClose" title="Schließen">✕</button>
      <h3 id="settingsTitle">Einstellungen</h3>
      <div id="settingsBody"></div>
    </div>
  </div>

<script>
/* ======================================================================
   Allgemeine Helfer
   ====================================================================== */
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------------- Startbildschirm ---------------- */
const splashStart = performance.now();
let splashHidden = false;
function hideSplash() {
  if (splashHidden) return; splashHidden = true;
  document.getElementById('splash').classList.add('gone');
}
window.addEventListener('load', () => setTimeout(hideSplash, Math.max(0, 1300 - (performance.now() - splashStart))));
setTimeout(hideSplash, 4500); // Sicherheitsnetz, falls z. B. Schriften hängen

/* ---------------- Aussehen-Einstellungen (Zustand) ---------------- */
const APPEARANCE_KEY = 'dashboard_appearance_v1';
let appearance = {};
try { appearance = JSON.parse(localStorage.getItem(APPEARANCE_KEY)) || {}; } catch (e) { appearance = {}; }
function saveAppearance() {
  localStorage.setItem(APPEARANCE_KEY, JSON.stringify(appearance));
  applyAppearance(appearance);
}

/* ---------------- Mauszeiger nach x s ohne Bewegung ausblenden ---------------- */
let cursorTimer = null;
function wakeCursor() {
  document.body.classList.remove('hide-cursor');
  clearTimeout(cursorTimer);
  if (appearance.hideCursor === false) return;
  const secs = appearance.cursorDelay || 3;
  cursorTimer = setTimeout(() => {
    if (!document.querySelector('.modal-overlay.open')) document.body.classList.add('hide-cursor');
  }, secs * 1000);
}
['mousemove', 'mousedown', 'wheel', 'keydown'].forEach(ev => document.addEventListener(ev, wakeCursor, { passive: true }));
wakeCursor();

/* ---------------- StandBy-Modus: große Uhr + Cover nach x Minuten ohne Bewegung ---------------- */
let standbyOn = false;
let standbyIdleTimer = null;
let standbyStartPos = null;
let nowPlaying = null;   // wird von Spotify befüllt: { name, artist, img, progress, duration, playing }
const sbEl = document.getElementById('standby');

function sbCfg() {
  return {
    enabled: appearance.standby !== false,
    idleMin: appearance.standbyIdle || 5,
    night: appearance.standbyNight === true,
    from: appearance.standbyFrom !== undefined ? appearance.standbyFrom : 20,
    to: appearance.standbyTo !== undefined ? appearance.standbyTo : 7
  };
}
function isNightTime() {
  const c = sbCfg(); const h = new Date().getHours();
  if (c.from === c.to) return false;
  return c.from < c.to ? (h >= c.from && h < c.to) : (h >= c.from || h < c.to);
}
function scheduleStandby() {
  clearTimeout(standbyIdleTimer);
  const c = sbCfg();
  if (!c.enabled || standbyOn) return;
  const ms = (c.night && isNightTime()) ? 30 * 1000 : c.idleMin * 60 * 1000;
  standbyIdleTimer = setTimeout(enterStandby, ms);
}
function enterStandby() {
  if (standbyOn) return;
  if (document.querySelector('.modal-overlay.open')) { scheduleStandby(); return; }
  standbyOn = true; standbyStartPos = null;
  updateStandby();
  sbEl.classList.add('on');
}
function exitStandby() {
  if (!standbyOn) return;
  standbyOn = false;
  sbEl.classList.remove('on');
  scheduleStandby();
}
function onActivity(e) {
  if (standbyOn) {
    // Kleines Zittern der Maus soll den StandBy nicht beenden
    if (e.type === 'mousemove') {
      if (!standbyStartPos) { standbyStartPos = [e.clientX, e.clientY]; return; }
      if (Math.abs(e.clientX - standbyStartPos[0]) + Math.abs(e.clientY - standbyStartPos[1]) < 12) return;
    }
    exitStandby();
    return;
  }
  scheduleStandby();
}
['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, onActivity, { passive: true }));

function updateStandby() {
  if (!standbyOn) return;
  const now = new Date();
  const opts = appearance.showSeconds ? { hour: '2-digit', minute: '2-digit', second: '2-digit' } : { hour: '2-digit', minute: '2-digit' };
  document.getElementById('sbClock').textContent = now.toLocaleTimeString('de-DE', opts);
  document.getElementById('sbDate').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  const np = nowPlaying;
  sbEl.classList.toggle('no-music', !np);
  if (!np) return;
  const art = document.getElementById('sbArt');
  if (np.img && art.getAttribute('src') !== np.img) {
    art.src = np.img;
    sbEl.style.setProperty('--sb-bg', `url("${np.img}")`);
  }
  document.getElementById('sbTrack').textContent = np.name;
  document.getElementById('sbArtist').textContent = np.artist;
  document.getElementById('sbFill').style.width = np.duration ? Math.min(100, np.progress / np.duration * 100) + '%' : '0%';
  sbEl.classList.toggle('paused', !np.playing);
}
scheduleStandby();

/* ---------------- Keine Browser-Spuren ---------------- */
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
  if (e.key === 'Escape') { closeTileModal(); closeSettings(); closeAfModal(); }
});
document.addEventListener('dragstart', e => {
  // Ziehen nur bei den To-Dos erlaubt (Reihenfolge ändern), sonst nie
  if (!(e.target.closest && e.target.closest('#list li'))) e.preventDefault();
});

/* ---------------- Verbindungsanzeige ---------------- */
let isOffline = !navigator.onLine;
let spotifyBroken = false;
const netPill = document.getElementById('netPill');
function updateNetPill() {
  if (isOffline) {
    netPill.textContent = '⚠ Keine Internetverbindung – verbinde neu…';
    netPill.classList.remove('warn'); netPill.classList.add('show');
  } else if (spotifyBroken) {
    netPill.textContent = '⚠ Spotify getrennt';
    netPill.classList.add('warn', 'show');
  } else {
    netPill.classList.remove('show');
  }
}
function markOnline() { if (isOffline && navigator.onLine) { isOffline = false; updateNetPill(); } }
function markOffline() { if (!isOffline) { isOffline = true; updateNetPill(); } }
window.addEventListener('offline', markOffline);
window.addEventListener('online', () => {
  isOffline = false; updateNetPill();
  // Alles sofort neu holen statt bis zum nächsten Intervall zu warten
  loadWeather(); pollNow();
});
updateNetPill();

/* ======================================================================
   Streamdeck / Schnellzugriff
   ====================================================================== */
const SD_KEY = 'dashboard_streamdeck_v1';
const SCREEN_KEY = 'dashboard_link_screen_v1';
let sdLinks = [];
try { sdLinks = JSON.parse(localStorage.getItem(SD_KEY)) || []; } catch (e) { sdLinks = []; }
const sdGrid = document.getElementById('sdGrid');
const sdCard = document.getElementById('streamdeckCard');

function saveStreamdeck() { localStorage.setItem(SD_KEY, JSON.stringify(sdLinks)); }

function getLinkScreen() { try { return JSON.parse(localStorage.getItem(SCREEN_KEY)); } catch (e) { return null; } }

/* Öffnet einen Link - wenn ein Zielbildschirm gewählt ist, als eigenes Fenster genau dort */
function openLink(url) {
  const s = getLinkScreen();
  if (s) {
    const features = `popup,left=${s.left},top=${s.top},width=${s.width},height=${s.height}`;
    const w = window.open(url, '_blank', features);
    if (w) return;
  }
  window.open(url, '_blank');
}

function renderStreamdeck() {
  sdGrid.innerHTML = '';
  sdLinks.forEach((link, idx) => {
    const btn = document.createElement('div');
    btn.className = 'sd-btn';
    btn.innerHTML = `<button class="sd-remove" title="Entfernen">✕</button>` +
      `<button class="sd-edit" title="Bearbeiten">✎</button>` +
      `<button class="sd-move sd-move-left" title="Nach vorne">◀</button>` +
      `<button class="sd-move sd-move-right" title="Nach hinten">▶</button>` +
      `<div class="sd-icon"></div><div class="sd-label"></div>`;
    btn.querySelector('.sd-icon').textContent = link.icon || '🔗';
    btn.querySelector('.sd-label').textContent = link.label;
    btn.addEventListener('click', (e) => {
      if (e.target.closest('.sd-remove') || e.target.closest('.sd-edit') || e.target.closest('.sd-move')) return;
      if (sdCard.classList.contains('edit-mode')) return;
      openLink(link.url);
    });
    btn.querySelector('.sd-remove').addEventListener('click', () => {
      const [removed] = sdLinks.splice(idx, 1); saveStreamdeck(); renderStreamdeck();
      showToast('Kachel „' + removed.label + '“ entfernt', 'Rückgängig', () => { sdLinks.splice(idx, 0, removed); saveStreamdeck(); renderStreamdeck(); });
    });
    btn.querySelector('.sd-edit').addEventListener('click', () => openTileModal(idx));
    const leftBtn = btn.querySelector('.sd-move-left');
    const rightBtn = btn.querySelector('.sd-move-right');
    leftBtn.disabled = idx === 0;
    rightBtn.disabled = idx === sdLinks.length - 1;
    leftBtn.addEventListener('click', () => moveStreamdeckLink(idx, -1));
    rightBtn.addEventListener('click', () => moveStreamdeckLink(idx, 1));
    sdGrid.appendChild(btn);
  });
}
function moveStreamdeckLink(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sdLinks.length) return;
  const [item] = sdLinks.splice(idx, 1);
  sdLinks.splice(newIdx, 0, item);
  saveStreamdeck(); renderStreamdeck();
}

/* ---- Modal zum Hinzufügen/Bearbeiten einer Kachel ---- */
const tileModal = document.getElementById('tileModal');
const tileModalTitle = document.getElementById('tileModalTitle');
const tileModalLabel = document.getElementById('tileModalLabel');
const tileModalUrl = document.getElementById('tileModalUrl');
const tileModalIcon = document.getElementById('tileModalIcon');
let tileModalEditIdx = null;

function openTileModal(idx) {
  tileModalEditIdx = (typeof idx === 'number') ? idx : null;
  const link = tileModalEditIdx !== null ? (sdLinks[tileModalEditIdx] || {}) : {};
  tileModalTitle.textContent = tileModalEditIdx !== null ? 'Kachel bearbeiten' : 'Neue Kachel';
  tileModalLabel.value = link.label || '';
  tileModalUrl.value = link.url || '';
  tileModalIcon.value = link.icon || '🔗';
  tileModal.classList.add('open');
  setTimeout(() => tileModalLabel.focus(), 50);
}
function closeTileModal() { tileModal.classList.remove('open'); tileModalEditIdx = null; }
document.getElementById('tileModalCancel').addEventListener('click', closeTileModal);
tileModal.addEventListener('click', (e) => { if (e.target === tileModal) closeTileModal(); });
document.getElementById('tileModalSave').addEventListener('click', () => {
  const label = tileModalLabel.value.trim();
  const url = tileModalUrl.value.trim();
  const icon = tileModalIcon.value.trim() || '🔗';
  if (!label || !url) { tileModalLabel.focus(); return; }
  const entry = { label, url, icon };
  if (tileModalEditIdx !== null) sdLinks[tileModalEditIdx] = entry; else sdLinks.push(entry);
  saveStreamdeck(); renderStreamdeck(); closeTileModal();
});
document.getElementById('sdAddBtn').addEventListener('click', () => openTileModal(null));
document.getElementById('sdDoneBtn').addEventListener('click', () => sdCard.classList.remove('edit-mode'));
renderStreamdeck();

/* ======================================================================
   Theme & Vollbild
   ====================================================================== */
const THEME_KEY = 'dashboard_theme_v1';
const THEMES = [['default', 'Standard'], ['mono', 'Minimal'], ['nord', 'Nord'], ['forest', 'Wald']];
function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'default'; }
function applyTheme(theme) {
  if (!theme || theme === 'default' || !THEMES.some(t => t[0] === theme)) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
  const i = THEMES.findIndex(t => t[0] === currentTheme());
  const next = THEMES[(i + 1) % THEMES.length][0];
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
function themeName() { return (THEMES.find(t => t[0] === currentTheme()) || THEMES[0])[1]; }

/* ======================================================================
   Uhrzeit / Datum / KW - Ziffern rollen beim Umspringen, exakt zur vollen Minute
   ====================================================================== */
function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
const clockEl = document.getElementById('clock');
let lastClock = '';
let lastDateStr = null;
function renderClock(str) {
  if (clockEl.children.length !== str.length) {
    clockEl.innerHTML = '';
    for (const ch of str) {
      const s = document.createElement('span'); s.className = 'd'; s.textContent = ch; clockEl.appendChild(s);
    }
    lastClock = str; return;
  }
  [...str].forEach((ch, i) => {
    if (lastClock[i] !== ch) {
      const s = clockEl.children[i];
      s.textContent = ch;
      restartAnim(s, 'roll');
    }
  });
  lastClock = str;
}
function tick() {
  const now = new Date();
  const timeOpts = appearance.showSeconds ? { hour: '2-digit', minute: '2-digit', second: '2-digit' } : { hour: '2-digit', minute: '2-digit' };
  renderClock(now.toLocaleTimeString('de-DE', timeOpts));
  const dateStr = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('date').textContent = dateStr;
  document.getElementById('kw').textContent = 'KW ' + isoWeek(now);
  lastDateStr = dateStr;
  updateStandby();
}
let tickTimer = null;
function scheduleTick() {
  clearTimeout(tickTimer);
  const now = new Date();
  const ms = appearance.showSeconds
    ? 1000 - now.getMilliseconds() + 20
    : 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 50;
  tickTimer = setTimeout(() => { tick(); scheduleTick(); }, ms);
}

const WEATHER_LOC_KEY = 'dashboard_weather_loc_v1';
const weatherCard = document.getElementById('weatherCard');
const WMO = {
  0:['Klar','☀️'],1:['Meist klar','🌤️'],2:['Teilw. bewölkt','⛅'],3:['Bewölkt','☁️'],
  45:['Nebel','🌫️'],48:['Nebel','🌫️'],51:['Nieselregen','🌦️'],53:['Nieselregen','🌦️'],55:['Nieselregen','🌦️'],

  80:['Schauer','🌦️'],81:['Schauer','🌦️'],82:['Starke Schauer','🌦️'],95:['Gewitter','⛈️'],96:['Gewitter','⛈️'],99:['Gewitter','⛈️']

function wmoInfo(code) { return WMO[code] || ['–', '—']; }
let weatherRetry = null;

function renderWeatherSettings() {
  weatherCard.innerHTML = `
    <div class="settings">
      <label>Ort (Stadt)</label>
      <input type="text" id="wCity" placeholder="z. B. Rottenburg am Neckar">
      <button class="link-btn" id="wSave">Speichern</button>

  restartAnim(weatherCard, 'swap-in');

      const geo = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + encodeURIComponent(city)).then(r => r.json());
      const hit = geo.results?.[0];

function loadWeather() {
  let loc = null;
  try { loc = JSON.parse(localStorage.getItem(WEATHER_LOC_KEY)); } catch (e) {}
  if (!loc) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude, ''),
        () => renderWeatherSettings(),
        { timeout: 5000 }
      );
    } else renderWeatherSettings();
    return;
  }
  fetchWeather(loc.lat, loc.lon, loc.name);
}

async function fetchWeather(lat, lon, name) {
  clearTimeout(weatherRetry);
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather ' + res.status);
    const data = await res.json();
    markOnline();
    const code = data.current.weather_code;
    const [desc, icon] = wmoInfo(code);
    const accent = code === 0 || code === 1 ? '#f5b95c' : (code >= 61 && code <= 82) ? '#5bb8ff' : (code >= 71 && code <= 75) ? '#8fd8ff' : '#a6acc4';
    weatherCard.style.setProperty('--weather-accent', accent);
    weatherCard.style.setProperty('--weather-soft', accent + '33');
    weatherCard.innerHTML = `
      <div class="weather-icon">${icon}</div>
      <div class="weather-temp">${Math.round(data.current.temperature_2m)}°C</div>
      <div class="weather-desc"></div>
      <div class="weather-minmax">↓${Math.round(data.daily.temperature_2m_min[0])}° / ↑${Math.round(data.daily.temperature_2m_max[0])}°</div>`;
    weatherCard.querySelector('.weather-desc').textContent = desc + (name ? ' · ' + name : '');
    if (!weatherShown) { restartAnim(weatherCard, 'swap-in'); weatherShown = true; }
  } catch (e) {
    if (!weatherShown) weatherCard.innerHTML = '<div class="weather-desc">Wetter wird geladen…</div>';
    if (!navigator.onLine) markOffline();
    weatherRetry = setTimeout(loadWeather, 60 * 1000); // schneller neuer Versuch statt 15 min warten
  }
}

function render() {

/* ---- Reihenfolge per Ziehen ändern ---- */
let dragId = null;
function clearDropMarks() { list.querySelectorAll('li').forEach(l => l.classList.remove('drop-before', 'drop-after')); }
list.addEventListener('dragstart', e => {
  const li = e.target.closest('li'); if (!li) return;
  dragId = li.dataset.id;
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
list.addEventListener('dragend', () => {
  dragId = null;
  list.querySelectorAll('li').forEach(l => l.classList.remove('dragging'));
  clearDropMarks();
});
list.addEventListener('dragover', e => {
  if (!dragId) return;
  const li = e.target.closest('li');
  if (!li || li.dataset.id === dragId) return;
  e.preventDefault();
  const r = li.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  clearDropMarks();
  li.classList.add(after ? 'drop-after' : 'drop-before');
});
list.addEventListener('drop', e => {
  e.preventDefault();
  const li = e.target.closest('li');
  if (!li || !dragId || li.dataset.id === dragId) return;
  const after = li.classList.contains('drop-after');
  const from = todos.findIndex(t => t.id === dragId);
  if (from < 0) return;
  const [item] = todos.splice(from, 1);
  let to = todos.findIndex(t => t.id === li.dataset.id);
  if (after) to++;
  todos.splice(to, 0, item);
  render(); save();
});

   Aufträge - zweite Seite der rechten Kachel.
   Liest/schreibt dieselbe auftraege.json wie die große auftraege.html,

const AF_FILE = 'auftraege.json';
const AF_BACKUP_DIR = 'Sicherungen';
const AF_STATUSES = ['Neu', 'In Arbeit', 'Wartet', 'Fertig'];
const VIEW_KEY = 'dashboard_right_view_v1';
let afDir = null, afFileHandle = null, afLastMod = 0, afSaving = false, afQueued = false, afBlock = false;

const afState = { tab: 'aktiv', q: '' };

/* Gleiche Datenbank wie auftraege.html -> liegen beide auf GitHub, reicht eine Freigabe für beide */
function afIdbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('auftraege-app', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function afIdbGet(k) {
  try { const db = await afIdbOpen(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e) { return undefined; }
}
async function afIdbSet(k, v) {
  try { const db = await afIdbOpen(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  catch (e) {}
}

function afShowConnect(title, text, onClick, showOther) {

/* ---- Speichern ---- */
function afSetSaved(text, err) { const el = $id('afSaved'); el.textContent = text; el.classList.toggle('err', !!err); }
async function afPersist() {
  if (afBlock || !afFileHandle) return;
  if (afSaving) { afQueued = true; return; }
  afSaving = true;
  try {
    await afDailyBackup();
    afData.version = 1; afData.gespeichert = new Date().toISOString();
    const w = await afFileHandle.createWritable();
    await w.write(JSON.stringify(afData, null, 2)); await w.close();
    afLastMod = (await afFileHandle.getFile()).lastModified;
    afSetSaved('Gespeichert ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { afSetSaved('Nicht gespeichert!', true); showToast('Speichern fehlgeschlagen'); }
  finally { afSaving = false; if (afQueued) { afQueued = false; afPersist(); } }
}
async function afDailyBackup() {
  const today = new Date().toISOString().slice(0, 10);
  if ((await afIdbGet('lastBackup')) === today) return;
  try {
    const cur = await (await afFileHandle.getFile()).text();
    if (!cur.trim()) return;
    const bd = await afDir.getDirectoryHandle(AF_BACKUP_DIR, { create: true });
    const bf = await bd.getFileHandle('auftraege-' + today + '.json', { create: true });
    const w = await bf.createWritable(); await w.write(cur); await w.close();
    const names = [];
    for await (const [n] of bd.entries()) if (/^auftraege-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort();
    for (const n of names.slice(0, Math.max(0, names.length - 30))) await bd.removeEntry(n);
    await afIdbSet('lastBackup', today);
  } catch (e) {}
}

/* ---- Darstellung ---- */
function afHighlight(el, text) {
  text = text == null ? '' : String(text);
  const words = afState.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { el.textContent = text; return; }
  const lower = text.toLowerCase(); const rs = [];
  words.forEach(w => { let i = 0; while ((i = lower.indexOf(w, i)) !== -1) { rs.push([i, i + w.length]); i += w.length; } });
  if (!rs.length) { el.textContent = text; return; }
  rs.sort((a, b) => a[0] - b[0]);
  const m = []; rs.forEach(r => { const l = m[m.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else m.push(r.slice()); });
  let p = 0;
  m.forEach(([s, e]) => { if (s > p) el.append(text.slice(p, s)); const mk = document.createElement('mark'); mk.textContent = text.slice(s, e); el.append(mk); p = e; });
  if (p < text.length) el.append(text.slice(p));
}
function afStatusClass(s) { return 'st-' + String(s || 'Neu').replace(/\s+/g, ''); }

function afRender() {
  const all = afData.auftraege;
  const aktiv = all.filter(a => a.status !== 'Fertig'), fertig = all.filter(a => a.status === 'Fertig');
  $id('afCntA').textContent = aktiv.length; $id('afCntF').textContent = fertig.length;
  $id('afSwitchCount').textContent = afFileHandle ? aktiv.length : '';
  document.querySelectorAll('.af-chip').forEach(c => c.classList.toggle('active', c.dataset.tab === afState.tab));
  const words = afState.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = (afState.tab === 'aktiv' ? aktiv : fertig)
    .filter(a => { const h = [a.kunde, a.auftrag, a.art, a.status, a.pfad, a.notizen].join(' ').toLowerCase(); return words.every(w => h.includes(w)); })
    .sort((x, y) => afState.tab === 'fertig'
      ? String(y.fertigAm || '').localeCompare(String(x.fertigAm || ''))
      : (AF_STATUSES.indexOf(x.status) - AF_STATUSES.indexOf(y.status)) || String(x.kunde || '').localeCompare(String(y.kunde || ''), 'de'));
  const ul = $id('afList'); ul.innerHTML = '';
  rows.forEach(a => {
    const li = document.createElement('li');
    li.classList.add(afStatusClass(a.status));   // färbt den Streifen links in der Statusfarbe
    li.style.animation = a.id === afFlashId ? '' : 'none';
    if (a.id === afFlashId) li.classList.add('flash');
    const l1 = document.createElement('div'); l1.className = 'af-l1';
    const k = document.createElement('span'); k.className = 'af-kunde'; afHighlight(k, a.kunde || '–');
    const nr = document.createElement('span'); nr.className = 'af-nr'; afHighlight(nr, a.auftrag || '');
    const sel = document.createElement('select'); sel.className = 'af-status ' + afStatusClass(a.status);
    AF_STATUSES.forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s; sel.appendChild(o); });
    sel.value = a.status || 'Neu';
    sel.addEventListener('click', e => e.stopPropagation());
    sel.addEventListener('change', () => afChangeStatus(a.id, sel.value, li));

/* ======================================================================
   Spotify: echte Steuerung via PKCE OAuth
   ====================================================================== */
const CFG_KEY = 'spotify_pkce_config_v1';
const TOKEN_KEY = 'spotify_pkce_tokens_v1';
const SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state user-library-modify user-library-read playlist-read-private playlist-read-collaborative';
const card = document.getElementById('spotifyCard');

let pollTimer = null;

function getConfig() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } }
function setConfig(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function getTokens() { try { return JSON.parse(localStorage.getItem(TOKEN_KEY)) || null; } catch (e) { return null; } }
function setTokens(t) { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }

function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = ''; const arr = crypto.getRandomValues(new Uint8Array(len));
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
async function sha256base64url(str) {
  const data = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

    </div>`;

  document.getElementById('cfgClientId').value = cfg ? cfg.clientId : '';

function reconnectSpotify() {
  if (!getConfig()) { renderSettingsForm(); return; }
  localStorage.removeItem(TOKEN_KEY);
  startLogin();
}
async function startLogin() {
  const cfg = getConfig();
  if (!cfg) { renderSettingsForm(); return; }
  const verifier = randomString(64);
  const challenge = await sha256base64url(verifier);
  const state = randomString(16);
  sessionStorage.setItem('sp_verifier', verifier);
  sessionStorage.setItem('sp_state', state);
  const params = new URLSearchParams({
    client_id: cfg.clientId, response_type: 'code', redirect_uri: cfg.redirect,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES, state, show_dialog: 'true'
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
async function exchangeCode(code) {
  const cfg = getConfig();
  const verifier = sessionStorage.getItem('sp_verifier');
  const body = new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: cfg.redirect, client_id: cfg.clientId, code_verifier: verifier });
  const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  if (!res.ok) throw new Error('token exchange failed');
  const data = await res.json();
  setTokens({ access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + data.expires_in * 1000, scope: data.scope });
  return data.scope;
}
async function refreshTokenIfNeeded(force) {
  const t = getTokens(); if (!t) return null;
  if (!force && Date.now() < t.expires_at - 30000) return t;
  const cfg = getConfig(); if (!cfg) return null;
  const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: cfg.clientId });
  let res;
  try {
    res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  } catch (e) { markOffline(); return 'offline'; }
  if (!res.ok) return null;
  const data = await res.json();
  const newTokens = { access_token: data.access_token, refresh_token: data.refresh_token || t.refresh_token, expires_at: Date.now() + data.expires_in * 1000 };
  setTokens(newTokens); return newTokens;
}

/* Akzentfarbe aus dem Albumcover berechnen (kräftige Farben bevorzugt) */
let lastCoverUrl = null;
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  return [h, s, l];
}
function applyCoverColor(url) {
  if (!url || url === lastCoverUrl) return;
  lastCoverUrl = url;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, 24, 24);
      const d = ctx.getImageData(0, 0, 24, 24).data;
      let r = 0, g = 0, b = 0, w = 0;
      for (let i = 0; i < d.length; i += 4) {
        const R = d[i], G = d[i + 1], B = d[i + 2];
        const mx = Math.max(R, G, B), mn = Math.min(R, G, B);
        const sat = mx === 0 ? 0 : (mx - mn) / mx;
        const wt = 0.05 + sat * sat * (mx / 255);
        r += R * wt; g += G * wt; b += B * wt; w += wt;
      }
      const [h, s, l] = rgbToHsl(r / w, g / w, b / w);
      const sat = Math.round(Math.max(s, 0.45) * 100);
      const lig = Math.round(Math.min(Math.max(l, 0.52), 0.66) * 100);
      document.body.style.setProperty('--cover', `hsl(${Math.round(h * 360)} ${sat}% ${lig}%)`);
    } catch (e) { /* Bild ohne CORS-Freigabe: Standardfarbe bleibt */ }
  };
  img.src = url;
}

  const listEl = document.getElementById('plList');
  if (!data || !Array.isArray(data.items)) {
    if (!spotifyBroken) noteEl.textContent = 'Playlists konnten nicht geladen werden.';
    return;
  }
  noteEl.textContent = data.items.length ? '' : 'Keine Playlists gefunden.';
  data.items.filter(Boolean).forEach(pl => {
    const count = pl.tracks && typeof pl.tracks.total === 'number' ? pl.tracks.total + ' Songs' : (pl.owner ? pl.owner.display_name : '');
    listEl.appendChild(plRow({
      img: smallestImage(pl.images), title: pl.name, sub: count,
      onClick: async () => {
        noteEl.textContent = 'Starte „' + pl.name + '“…';
        await spotifyApi('/me/player/play', 'PUT', { context_uri: pl.uri });
        renderPlayer();
      }

}
